- name: mlgym_agent
  _target_: psrl.workers.agent_loop.loops.mlgym_agent_loop.MLGymAgentLoop
  runtime:
    image: ${oc.env:SANDBOX_IMAGE,psrl/airs-bench-agent:latest}
    data_root: ${oc.env:AIRS_DATA_ROOT}
    mlgym_repo: ${oc.env:MLGYM_REPO}
    sandbox_memory: 32g
    sandbox_cpus: 8.0
    episode_timeout_s: 10800.0
    per_action_timeout_s: 3600.0
