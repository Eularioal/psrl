   <g id="text_1">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Droid Sans Fallback'; text-anchor: start; fill: #233447" x="39.5136" y="51.368938" transform="rotate(-0 39.5136 51.368938)">选择 benchmark：先确定结果按什么判好坏</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; text-anchor: start; fill: #5e6e7c" x="39.5136" y="87.02775" transform="rotate(-0 39.5136 87.02775)">阅读分类图，任务名仅是代表。具体题目、评分协议与本地接入范围仍以正文为准。</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #2563a6" x="504" y="177.279937" transform="rotate(-0 504 177.279937)">同一份正确程序受硬件竞争拖慢</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #117f78" x="257.2416" y="331.480898" transform="rotate(-0 257.2416 331.480898)">正确性或固定工作量后的质量评分</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(173.2416 370.642179)">例如固定训练步数后的验证分数</text>
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(149.2416 389.197648)">共享可增加延迟，分数需另核对数值行为</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #c66b21" x="750.7584" y="331.510194" transform="rotate(-0 750.7584 331.510194)">耗时、吞吐或固定时间内的质量评分</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(657.805275 369.845304)">例如 KernelBench、训练 speedrun</text>
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(648.7584 389.408586)">竞争会直接改变分数或可完成的工作量</text>
   </g>
   <g id="text_8">
    <text style="font-size: 13px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #117f78" x="262.08" y="474.951203" transform="rotate(-0 262.08 474.951203)">先研究整批时间、排队与资源回收</text>
   </g>
   <g id="text_9">
    <text style="font-size: 13px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #c66b21" x="755.5968" y="474.925813" transform="rotate(-0 755.5968 474.925813)">同时控制测量条件与真实工作量</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #233447" x="504" y="540.324187" transform="rotate(-0 504 540.324187)">同一个题库也可有不同协议。固定步数与固定时长，会把同一训练任务变成不同的调度问题。</text>
   </g>
  </g>
 </g>
