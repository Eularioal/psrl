   <g id="text_1">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Droid Sans Fallback'; text-anchor: start; fill: #233447" x="39.5136" y="55.544938" transform="rotate(-0 39.5136 55.544938)">YARN 的启发：应用说清需要什么，资源层决定怎样分</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; text-anchor: start; fill: #5e6e7c" x="39.5136" y="96.7695" transform="rotate(-0 39.5136 96.7695)">左侧是 YARN 的角色，右侧是 PSRL 对应分析。虚线框中的跨候选比较协议仍是提案。</text>
   </g>
