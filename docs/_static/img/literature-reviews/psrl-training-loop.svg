   <g id="text_1">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Droid Sans Fallback'; text-anchor: start; fill: #233447" x="39.5136" y="51.368938" transform="rotate(-0 39.5136 51.368938)">PSRL：做题和更新参数通过样本与版本衔接</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; text-anchor: start; fill: #5e6e7c" x="39.5136" y="87.02775" transform="rotate(-0 39.5136 87.02775)">简化数据流，对应阅读指南中的 1 至 7。重试、验证与可选优化省略，实际训练触发取决于批次配置。</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #2563a6" x="174.9888" y="209.183878" transform="rotate(-0 174.9888 209.183878)">[1、2] Manager / Worker</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(120.9888 240.486834)">派发题目，组织交互</text>
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(108.9888 259.393866)">一个任务可多次请求模型</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #7756a4" x="504" y="209.506144" transform="rotate(-0 504 209.506144)">[3、4] 生成 Router / vLLM</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(438 240.510272)">选择实例，生成下一动作</text>
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(450 259.393866)">生成结果回到原任务</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #117f78" x="833.0112" y="209.564737" transform="rotate(-0 833.0112 209.564737)">环境工具（按需调用）</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(775.214325 240.721209)">CPU 或 GPU 执行命令</text>
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(779.0112 259.370428)">工具输出回到原任务</text>
   </g>
