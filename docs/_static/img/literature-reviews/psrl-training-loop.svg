   </g>
   <g id="text_10">
    <text style="font-size: 11px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #117f78" x="504" y="129.611688" transform="rotate(-0 504 129.611688)">Worker 按需调用环境，接收工具输出</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #2563a6" x="174.9888" y="390.111441" transform="rotate(-0 174.9888 390.111441)">[5] 评分与样本存储</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(108.9888 421.273772)">按规则组织轨迹与题目组</text>
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(97.246612 439.313616)">TransferQueue 保存训练字段</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #c66b21" x="504" y="390.111441" transform="rotate(-0 504 390.111441)">[6] 训练端</text>
   </g>
   <g id="text_14">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(438 421.297209)">所需一批样本满足条件后</text>
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(450 439.899553)">读取数据并更新模型</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #7756a4" x="833.0112" y="390.140738" transform="rotate(-0 833.0112 390.140738)">[7] 参数服务</text>
   </g>
   <g id="text_16">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(785.0112 421.226897)">保存并发布新版本</text>
