   <g id="text_1">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Droid Sans Fallback'; text-anchor: start; fill: #233447" x="39.5136" y="47.192937" transform="rotate(-0 39.5136 47.192937)">保护测量区域，把 CPU 准备重叠起来</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; text-anchor: start; fill: #5e6e7c" x="39.5136" y="77.426625" transform="rotate(-0 39.5136 77.426625)">教学假设：四条命令各准备 90 ms、测量 10 ms。CPU 足够，忽略 GPU 正确性检查。</text>
   </g>
   <g id="text_3">
    <text style="font-size: 13px; font-family: 'Droid Sans Fallback'; text-anchor: start; fill: #233447" x="39.5136" y="167.079203" transform="rotate(-0 39.5136 167.079203)">整命令串行</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #ffffff" x="311.43168" y="166.788187" transform="rotate(-0 311.43168 166.788187)">命令 1 准备</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #ffffff" x="485.61408" y="166.788187" transform="rotate(-0 485.61408 166.788187)">命令 2 准备</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #ffffff" x="659.79648" y="166.788187" transform="rotate(-0 659.79648 166.788187)">命令 3 准备</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #ffffff" x="833.97888" y="166.788187" transform="rotate(-0 833.97888 166.788187)">命令 4 准备</text>
   </g>
   <g id="text_8">
    <text style="font-size: 13px; font-family: 'Droid Sans Fallback'; text-anchor: start; fill: #233447" x="39.5136" y="267.551031" transform="rotate(-0 39.5136 267.551031)">仅测量串行</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #ffffff" x="311.43168" y="267.31275" transform="rotate(-0 311.43168 267.31275)">四条同时准备</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #5e6e7c" x="233.0496" y="328.988391" transform="rotate(-0 233.0496 328.988391)">0</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #5e6e7c" x="389.81376" y="328.988391" transform="rotate(-0 389.81376 328.988391)">90</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #5e6e7c" x="466.454016" y="328.988391" transform="rotate(-0 466.454016 328.988391)">134</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #5e6e7c" x="581.4144" y="328.988391" transform="rotate(-0 581.4144 328.988391)">200</text>
   </g>
   <g id="text_14">
    <text style="font-size: 11px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #5e6e7c" x="755.5968" y="328.988391" transform="rotate(-0 755.5968 328.988391)">300</text>
   </g>
   <g id="text_15">
    <text style="font-size: 11px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #5e6e7c" x="929.7792" y="328.988391" transform="rotate(-0 929.7792 328.988391)">400</text>
   </g>
   <g id="text_16">
    <text style="font-size: 11px; font-family: 'Droid Sans Fallback'; text-anchor: end; fill: #5e6e7c" x="929.7792" y="353.250656" transform="rotate(-0 929.7792 353.250656)">从任务提交开始计时，单位：毫秒</text>
   </g>
   <g id="text_17">
    <text style="font-size: 14px; font-family: 'Droid Sans Fallback'; text-anchor: start; fill: #233447" x="49.1904" y="416.346219" transform="rotate(-0 49.1904 416.346219)">整命令：4 × (90 + 10) = 400 ms。区域保护：90 + 4 × (1 + 10) = 134 ms。</text>
   </g>
   <g id="text_18">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; text-anchor: start; fill: #5e6e7c" x="49.1904" y="468.432187" transform="rotate(-0 49.1904 468.432187)">蓝色测量始终逐条进行。收益来自绿色准备阶段重叠，每次保护另计 1 ms，真实隔离成本需要实测。</text>
   </g>
