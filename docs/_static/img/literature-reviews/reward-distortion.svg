   <g id="text_13">
    <text style="font-size: 14px; font-family: 'Droid Sans Fallback'; text-anchor: start; fill: #233447" x="49.1904" y="406.770219" transform="rotate(-0 49.1904 406.770219)">无干扰时 A 更快，奖励更高。竞争后 A 的代码没变，却因测量条件更差而输给 B。</text>
   </g>
   <g id="text_14">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; text-anchor: start; fill: #5e6e7c" x="49.1904" y="463.644187" transform="rotate(-0 49.1904 463.644187)">测量条件 → 时间 → 奖励 → 下一轮保留的候选或训练信号。这条反馈链使调度影响搜索方向。</text>
