   <g id="text_1">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Droid Sans Fallback'; text-anchor: start; fill: #233447" x="39.5136" y="47.192937" transform="rotate(-0 39.5136 47.192937)">计时进入奖励后，竞争可能让代码好坏被颠倒</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; text-anchor: start; fill: #5e6e7c" x="39.5136" y="77.37975" transform="rotate(-0 39.5136 77.37975)">教学假设：同一输入、同一参考 12 μs，奖励为参考时间 / 候选时间。柱长只表示候选耗时。</text>
   </g>
   <g id="text_3">
    <text style="font-size: 14px; font-family: 'Droid Sans Fallback'; text-anchor: start; fill: #233447" x="39.5136" y="119.462875" transform="rotate(-0 39.5136 119.462875)">相同无干扰条件</text>
   </g>
   <g id="text_4">
    <text style="font-size: 13px; font-family: 'Droid Sans Fallback'; text-anchor: start; fill: #233447" x="204.0192" y="157.147734" transform="rotate(-0 204.0192 157.147734)">A</text>
