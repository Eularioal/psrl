   <g id="text_1">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Droid Sans Fallback'; text-anchor: start; fill: #233447" x="39.5136" y="51.454875" transform="rotate(-0 39.5136 51.454875)">把低频语义分析与每条命令的快速派发分开</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; text-anchor: start; fill: #5e6e7c" x="39.5136" y="87.02775" transform="rotate(-0 39.5136 87.02775)">设计提案：模型提供信息，普通程序检查约束并执行。编号与模型调度大脑正文对应。</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #7756a4" x="179.8272" y="187.647441" transform="rotate(-0 179.8272 187.647441)">[O1] 代码与版本观测</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(119.8272 218.716022)">脚本、差异、执行历史</text>
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(113.8272 237.529303)">标记采集时间和适用版本</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #7756a4" x="518.5152" y="187.618144" transform="rotate(-0 518.5152 187.618144)">[S1] 模型分析</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(464.5152 218.809772)">低频提取阶段与依赖</text>
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(458.5152 237.529303)">信息不足时可返回未知</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #7756a4" x="842.688" y="187.647441" transform="rotate(-0 842.688 187.647441)">结构化结果缓存</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(794.688 218.833209)">绑定版本与有效期</text>
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(788.688 237.505866)">新代码不复用旧解释</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #2563a6" x="179.8272" y="401.084738" transform="rotate(-0 179.8272 401.084738)">[V1、P1] 快速决策</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(113.8272 432.241209)">结合当前队列和语义缓存</text>
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(119.8272 450.866991)">检查合法性并比较成本</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #117f78" x="518.5152" y="401.055441" transform="rotate(-0 518.5152 401.055441)">[E1] 准入与执行</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(458.5152 432.194334)">重新检查资源是否可用</text>
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(470.5152 450.913866)">获准后才运行命令</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #117f78" x="842.688" y="401.055441" transform="rotate(-0 842.688 401.055441)">[R1] 归还与反馈</text>
   </g>
   <g id="text_14">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(806.688 432.241209)">核实物理释放</text>
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(794.688 450.890428)">再更新账本与观测</text>
   </g>
