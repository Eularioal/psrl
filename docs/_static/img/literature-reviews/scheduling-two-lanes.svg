   <g id="text_16">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #233447" x="504" y="534.852188" transform="rotate(-0 504 534.852188)">上层分析可以提前进行。下层每次派发仍读取现场资源，模型建议本身不占有 GPU 配额。</text>
