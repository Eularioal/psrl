    <text style="font-weight: 700; font-size: 15px; font-family: 'Droid Sans Fallback'; fill: #7756a4" transform="translate(802.5264 359.367728)">模型调度大脑</text>
   </g>
   <g id="text_14">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(811.5264 394.679852)">应用声明需求</text>
