   <g id="text_1">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Droid Sans Fallback'; text-anchor: start; fill: #233447" x="39.5136" y="51.368938" transform="rotate(-0 39.5136 51.368938)">先辨认要减少哪种等待，再选择论文</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; text-anchor: start; fill: #5e6e7c" x="39.5136" y="87.02775" transform="rotate(-0 39.5136 87.02775)">概念阅读地图。各论文的机制与证据范围在对应正文说明。</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #2563a6" x="150.7968" y="199.167937" transform="rotate(-0 150.7968 199.167937)">模型等慢工具</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Droid Sans Fallback'; fill: #2563a6" transform="translate(128.062425 343.020071)">RollArt</text>
    <text style="font-weight: 700; font-size: 15px; font-family: 'Droid Sans Fallback'; fill: #2563a6" transform="translate(125.4843 359.016165)">DynaRL</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(114.7968 394.726727)">独立推进轨迹</text>
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(102.7968 413.329071)">按阶段瓶颈分资源</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #117f78" x="383.04" y="199.197234" transform="rotate(-0 383.04 199.197234)">任务等空闲 GPU</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Droid Sans Fallback'; fill: #117f78" transform="translate(355.413047 342.639212)">Firepool</text>
    <text style="font-weight: 700; font-size: 15px; font-family: 'Droid Sans Fallback'; fill: #117f78" transform="translate(336.311484 359.397024)">GPU 任务调研</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(347.04 394.726727)">提前准备环境</text>
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(323.04 413.352508)">把就绪工作交给执行池</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #c66b21" x="615.2832" y="199.167937" transform="rotate(-0 615.2832 199.167937)">并发使评分失真</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Droid Sans Fallback'; fill: #c66b21" transform="translate(598.466794 343.020071)">KREX</text>
    <text style="font-weight: 700; font-size: 15px; font-family: 'Droid Sans Fallback'; fill: #c66b21" transform="translate(587.714841 359.016165)">AI4Infra</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(561.2832 394.656414)">区分普通执行与测量</text>
