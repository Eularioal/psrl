   <g id="text_1">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Droid Sans Fallback'; text-anchor: start; fill: #233447" x="39.5136" y="51.283" transform="rotate(-0 39.5136 51.283)">KREX：普通阶段允许重叠，关键测量轮流独占</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; text-anchor: start; fill: #5e6e7c" x="39.5136" y="86.980875" transform="rotate(-0 39.5136 86.980875)">依据论文重画的 NVIDIA 路径概念图。编号与精读正文的机制表对应，不是 PSRL 已实现调用链。</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #117f78" x="184.6656" y="190.989234" transform="rotate(-0 184.6656 190.989234)">[0] 命令与 context 配对</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(121.712475 232.239609)">复用健康 GPU 执行环境</text>
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(118.6656 250.771641)">导入、编译、准备可重叠</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #2563a6" x="504" y="190.989234" transform="rotate(-0 504 190.989234)">[1、2] 取得区域锁并关门</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(450 232.216172)">只选一个测量持有者</text>
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(456 250.888828)">阻止新的竞争提交</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #c66b21" x="823.3344" y="190.959938" transform="rotate(-0 823.3344 190.959938)">[3] 等待设备排空</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(769.3344 232.216172)">各参与进程协作确认</text>
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(763.3344 250.865391)">已提交的工作真正结束</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #c66b21" x="823.3344" y="382.479938" transform="rotate(-0 823.3344 382.479938)">[4、5] 保护测量条件</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(763.3344 423.548672)">先排空，再冻结竞争者</text>
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(760.920337 442.361953)">整理缓存并绑定 CPU 核</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #2563a6" x="504" y="382.479938" transform="rotate(-0 504 382.479938)">[6] 预热并执行测量</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(456 423.736172)">在规定条件下计时</text>
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(450 442.432266)">得到候选与参考耗时</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #117f78" x="184.6656" y="382.450641" transform="rotate(-0 184.6656 382.450641)">[7、8、9] 恢复与清理</text>
   </g>
   <g id="text_14">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(130.6656 423.572109)">先解冻，再开门放锁</text>
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; fill: #233447" transform="translate(107.439038 442.244766)">命令清理，健康 context 留用</text>
   </g>
   <g id="text_15">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; text-anchor: middle; fill: #233447" x="504" y="529.35675" transform="rotate(-0 504 529.35675)">context 是驱动维护的 GPU 执行环境。复用它可少做初始化，候选私有显存仍须按协议清理。</text>
   </g>
  </g>
 </g>
