   </g>
   <g id="text_11">
    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #203149" x="374.6304" y="721.660234" transform="rotate(-0 374.6304 721.660234)">占用：2 / 3 GiB</text>
   </g>
   <g id="text_12">
    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #203149" x="374.6304" y="750.898359" transform="rotate(-0 374.6304 750.898359)">空余：1 GiB</text>
   </g>
   <g id="text_13">
    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #203149" x="374.6304" y="779.784922" transform="rotate(-0 374.6304 779.784922)">B 需要：2 GiB</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 21px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #159b8d" x="67.2768" y="836.097246" transform="rotate(-0 67.2768 836.097246)">02  轮到 B</text>
   </g>
   <g id="text_15">
    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #203149" x="374.6304" y="831.468672" transform="rotate(-0 374.6304 831.468672)">2 + 2 &gt; 3，无法共存</text>
   </g>
   <g id="text_16">
    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #203149" x="374.6304" y="860.589609" transform="rotate(-0 374.6304 860.589609)">回收 A，重建 B</text>
   </g>
   <g id="text_17">
    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #203149" x="374.6304" y="890.140234" transform="rotate(-0 374.6304 890.140234)">保存可重建所需版本</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 21px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #d68b20" x="67.2768" y="946.298262" transform="rotate(-0 67.2768 946.298262)">03  再次请求 A</text>
   </g>
   <g id="text_19">
    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #203149" x="374.6304" y="941.980234" transform="rotate(-0 374.6304 941.980234)">先核对代码与数据版本</text>
   </g>
   <g id="text_20">
    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #203149" x="374.6304" y="971.140234" transform="rotate(-0 374.6304 971.140234)">有效状态才允许复用</text>
   </g>
   <g id="text_21">
    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #203149" x="374.6304" y="1000.300234" transform="rotate(-0 374.6304 1000.300234)">否则支付重建成本</text>
   </g>
  </g>
