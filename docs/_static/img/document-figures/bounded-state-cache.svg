   </g>
   <g id="text_4">
    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: middle; fill: #203149" x="236.8512" y="403.586562" transform="rotate(-0 236.8512 403.586562)">A：2 GiB</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: middle; fill: #159b8d" x="835.6608" y="263.861562" transform="rotate(-0 835.6608 263.861562)">另一个准备状态</text>
   </g>
   <g id="text_6">
    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: middle; fill: #203149" x="777.3696" y="403.586562" transform="rotate(-0 777.3696 403.586562)">B：2 GiB</text>
   </g>
   <g id="text_7">
    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: middle; fill: #203149" x="565.4016" y="514.975937" transform="rotate(-0 565.4016 514.975937)">A+B共4 GiB，无法同时放入3 GiB主存池。</text>
   </g>
   <g id="text_8">
    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: middle; fill: #203149" x="565.4016" y="601.955" transform="rotate(-0 565.4016 601.955)">保留谁，还要比较下一次使用机会、重建成本与版本有效性。</text>
   </g>
  </g>
