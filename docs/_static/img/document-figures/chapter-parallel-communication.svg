<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1380" viewBox="0 0 900 690"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677c"/></marker></defs><rect width="900" height="690" fill="white"/><g font-family="Droid Sans Fallback"><text x="32" y="38.0" text-anchor="start" style="font-size:26px" fill="#203149">切开模型以后，省下显存也增加了搬运</text><text x="32" y="74.0" text-anchor="start" style="font-size:17px" fill="#52677c">教学分工：TP 切同一层，PP 切不同层，DP 复制模型处理不同样本；不表示实际时延比例。</text><line x1="32" y1="95" x2="868" y2="95" stroke="#dbe4ee" stroke-width="1.5"/><text x="32" y="170.0" text-anchor="start" style="font-size:21px" fill="#276dc5">TP：同一层</text><rect x="230" y="140" width="260" height="68" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><rect x="590" y="140" width="260" height="68" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="360" y="182.0" text-anchor="middle" style="font-size:20px" fill="#276dc5">矩阵左半</text><text x="720" y="182.0" text-anchor="middle" style="font-size:20px" fill="#276dc5">矩阵右半</text><line x1="500" y1="173" x2="578" y2="173" stroke="#276dc5" stroke-width="1.5" marker-end="url(#arrow)"/><text x="230" y="249.0" text-anchor="start" style="font-size:19px" fill="#203149">交换部分结果 / 归约</text><text x="32" y="317.0" text-anchor="start" style="font-size:21px" fill="#008c7c">PP：不同层</text><rect x="230" y="287" width="260" height="68" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><rect x="590" y="287" width="260" height="68" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="360" y="329.0" text-anchor="middle" style="font-size:20px" fill="#008c7c">前半层</text><text x="720" y="329.0" text-anchor="middle" style="font-size:20px" fill="#008c7c">后半层</text><line x1="500" y1="320" x2="578" y2="320" stroke="#008c7c" stroke-width="1.5" marker-end="url(#arrow)"/><text x="230" y="396.0" text-anchor="start" style="font-size:19px" fill="#203149">把激活传给下一段</text><text x="32" y="464.0" text-anchor="start" style="font-size:21px" fill="#7950b4">DP：不同样本</text><rect x="230" y="434" width="260" height="68" rx="10" fill="#f1ebfa" stroke="#7950b4" stroke-width="1.5"/><rect x="590" y="434" width="260" height="68" rx="10" fill="#f1ebfa" stroke="#7950b4" stroke-width="1.5"/><text x="360" y="476.0" text-anchor="middle" style="font-size:20px" fill="#7950b4">完整模型：样本 A</text><text x="720" y="476.0" text-anchor="middle" style="font-size:20px" fill="#7950b4">完整模型：样本 B</text><line x1="500" y1="467" x2="578" y2="467" stroke="#7950b4" stroke-width="1.5" marker-end="url(#arrow)"/><text x="230" y="543.0" text-anchor="start" style="font-size:19px" fill="#203149">训练时同步梯度</text><rect x="32" y="610" width="836" height="60" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="48" y="635.0" text-anchor="start" style="font-size:17px" fill="#008c7c">显存决定放不放得下；互联带宽决定切开后传得够不够快。增加卡数不自动等比提速。</text></g></svg>