<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1340" viewBox="0 0 900 670"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677c"/></marker></defs><rect width="900" height="670" fill="white"/><g font-family="Droid Sans Fallback"><text x="32" y="38.0" text-anchor="start" style="font-size:26px" fill="#203149">改了哪里，就重建依赖它的状态</text><text x="32" y="74.0" text-anchor="start" style="font-size:17px" fill="#52677c">教学依赖图：模型权重固定，数据和评分代码可变化。颜色表示不同来源的依赖。</text><line x1="32" y1="95" x2="868" y2="95" stroke="#dbe4ee" stroke-width="1.5"/><rect x="32" y="135" width="225" height="68" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="144" y="177.0" text-anchor="middle" style="font-size:21px" fill="#276dc5">模型权重 v1</text><line x1="265" y1="169" x2="325" y2="169" stroke="#52677c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="335" y="135" width="300" height="68" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="485" y="177.0" text-anchor="middle" style="font-size:21px" fill="#276dc5">GPU 模型</text><text x="335" y="242.0" text-anchor="start" style="font-size:19px" fill="#276dc5">改权重 → 重载模型</text><rect x="32" y="268" width="225" height="68" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="144" y="310.0" text-anchor="middle" style="font-size:21px" fill="#008c7c">数据版本 v2</text><line x1="265" y1="302" x2="325" y2="302" stroke="#52677c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="335" y="268" width="300" height="68" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="485" y="310.0" text-anchor="middle" style="font-size:21px" fill="#008c7c">预处理 / 数据迭代器</text><text x="335" y="375.0" text-anchor="start" style="font-size:19px" fill="#008c7c">改数据 → 重建数据状态</text><rect x="32" y="401" width="225" height="68" rx="10" fill="#f1ebfa" stroke="#7950b4" stroke-width="1.5"/><text x="144" y="443.0" text-anchor="middle" style="font-size:21px" fill="#7950b4">评分代码 v3</text><line x1="265" y1="435" x2="325" y2="435" stroke="#52677c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="335" y="401" width="300" height="68" rx="10" fill="#f1ebfa" stroke="#7950b4" stroke-width="1.5"/><text x="485" y="443.0" text-anchor="middle" style="font-size:21px" fill="#7950b4">评分器 / 结果标签</text><text x="335" y="508.0" text-anchor="start" style="font-size:19px" fill="#7950b4">改评分 → 重建评分状态</text><text x="675" y="215.0" text-anchor="start" style="font-size:20px" fill="#203149">最终输出</text><text x="675" y="252.0" text-anchor="start" style="font-size:18px" fill="#203149">携带本轮版本</text><text x="675" y="289.0" text-anchor="start" style="font-size:18px" fill="#c64760">拒收旧结果</text><rect x="32" y="590" width="836" height="60" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="48" y="615.0" text-anchor="start" style="font-size:17px" fill="#008c7c">只改评分代码时，可以保留不依赖它的模型准备。通用依赖自动识别仍需要执行协议。</text></g></svg>