<svg xmlns="http://www.w3.org/2000/svg" width="800" height="498" viewBox="0 0 900 560"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677c"/></marker></defs><rect width="900" height="560" fill="white"/><g font-family="Droid Sans Fallback"><text x="32" y="38.0" text-anchor="start" style="font-size:26px" fill="#203149">Env 现状：会话留在主机，GPU 按持有模式调度</text><text x="32" y="74.0" text-anchor="start" style="font-size:17px" fill="#52677c">已启用 Env Service 的结构示意。候选资源来自配置，推理共享卡还需要显式绑定。</text><line x1="32" y1="95" x2="868" y2="95" stroke="#dbe4ee" stroke-width="1.5"/><rect x="32" y="119" width="256" height="76" rx="10" fill="#f1ebfa" stroke="#7950b4" stroke-width="1.5"/><text x="48" y="149.0" text-anchor="start" style="font-size:21px" fill="#7950b4">Agent / Harbor</text><text x="48" y="178.0" text-anchor="start" style="font-size:17px" fill="#203149">提出环境与命令需求</text><rect x="322" y="119" width="256" height="76" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="338" y="149.0" text-anchor="start" style="font-size:21px" fill="#276dc5">EnvRouter / 账本</text><text x="338" y="178.0" text-anchor="start" style="font-size:17px" fill="#203149">检查预算，批准或等待</text><rect x="612" y="119" width="256" height="76" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="628" y="149.0" text-anchor="start" style="font-size:21px" fill="#008c7c">容器执行层</text><text x="628" y="178.0" text-anchor="start" style="font-size:17px" fill="#203149">执行、评分与物理清理</text><line x1="292" y1="157" x2="316" y2="157" stroke="#52677c" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="582" y1="157" x2="606" y2="157" stroke="#52677c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="32" y="218" width="384" height="193" rx="10" fill="#f1ebfa" stroke="#7950b4" stroke-width="1.5"/><text x="48" y="248.0" text-anchor="start" style="font-size:20px" fill="#7950b4">会话 A 的主机资源：留在节点 N<