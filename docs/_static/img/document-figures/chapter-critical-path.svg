<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1480" viewBox="0 0 900 740"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677c"/></marker></defs><rect width="900" height="740" fill="white"/><g font-family="Droid Sans Fallback"><text x="32" y="38.0" text-anchor="start" style="font-size:26px" fill="#203149">先让谁用 GPU？要看它能解锁什么工作</text><text x="32" y="74.0" text-anchor="start" style="font-size:17px" fill="#52677c">教学假设：M 用 GPU 2 秒，随后解锁 CPU 工作 A（10 秒）；B 独立用 GPU 10 秒。</text><line x1="32" y1="95" x2="868" y2="95" stroke="#dbe4ee" stroke-width="1.5"/><text x="32" y="110.0" text-anchor="start" style="font-size:16px" fill="#52677c">同一时间轴（秒）</text><text x="155.0" y="138.0" text-anchor="middle" style="font-size:16px" fill="#52677c">0</text><line x1="155.0" y1="148" x2="155.0" y2="453" stroke="#e2e8f0" stroke-width="1.5"/><text x="217.27272727272728" y="138.0" text-anchor="middle" style="font-size:16px" fill="#52677c">2</text><line x1="217.27272727272728" y1="148" x2="217.27272727272728" y2="453" stroke="#e2e8f0" stroke-width="1.5"/><text x="528.6363636363636" y="138.0" text-anchor="middle" style="font-size:16px" fill="#52677c">12</text><line x1="528.6363636363636" y1="148" x2="528.6363636363636" y2="453" stroke="#e2e8f0" stroke-width="1.5"/><text x="840.0" y="138.0" text-anchor="middle" style="font-size:16px" fill="#52677c">22</text><line x1="840.0" y1="148" x2="840.0" y2="453" stroke="#e2e8f0" stroke-width="1.5"/><text x="32" y="190.0" text-anchor="start" style="font-size:18px" fill="#203149">模型优先</text><line x1="155" y1="203" x2="840" y2="203" stroke="#e2e8f0" stroke-width="1.5"/><rect x="155.0" y="165" width="62.27272727272727" height="38" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="186.13636363636363" y="190.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">M</text><rect x="217.27272727272728" y="165" width="311.3636363636364" height="38" rx="3" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="372.9545454545455" y="190.0" text-anchor="middle" style="font-size:17px" fill="#008c7c">B：10 秒</text><text x="32" y="260.0" text-anchor="start" style="font-size:18px" fill="#203149">CPU 上的 A</text><line x1="155" y1="273" x2="840" y2="273" stroke="#e2e8f0" stroke-width="1.5"/><rect x="217.27272727272728" y="235" width="311.3636363636364" height="38" rx="3" fill="#f1ebfa" stroke="#7950b4" stroke-width="1.5"/><text x="372.9545454545455" y="260.0" text-anchor="middle" style="font-size:17px" fill="#7950b4">A：10 秒，与 B 重叠</text><text x="32" y="330.0" text-anchor="start" style="font-size:18px" fill="#203149">环境优先</text><line x1="155" y1="343" x2="840" y2="343" stroke="#e2e8f0" stroke-width="1.5"/><rect x="155.0" y="305" width="311.3636363636364" height="38" rx="3" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="310.6818181818182" y="330.0" text-anchor="middle" style="font-size:17px" fill="#008c7c">B：10 秒</text><rect x="466.3636363636364" y="305" width="62.27272727272727" height="38" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="497.5" y="330.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">M</text><text x="32" y="400.0" text-anchor="start" style="font-size:18px" fill="#203149">CPU 上的 A</text><line x1="155" y1="413" x2="840" y2="413" stroke="#e2e8f0" stroke-width="1.5"/><rect x="528.6363636363636" y="375" width="311.3636363636364" height="38" rx="3" fill="#f1ebfa" stroke="#7950b4" stroke-width="1.5"/><text x="684.3181818181818" y="400.0" text-anchor="middle" style="font-size:17px" fill="#7950b4">A：10 秒</text><rect x="155" y="505" width="305" height="104" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="175" y="538.0" text-anchor="start" style="font-size:20px" fill="#008c7c">模型优先：最后完成于 12 秒</text><text x="175" y="574.0" text-anchor="start" style="font-size:17px" fill="#203149">M 先结束，A 与 B 才能重叠。</text><rect x="480" y="505" width="360" height="104" rx="10" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="500" y="538.0" text-anchor="start" style="font-size:20px" fill="#c8790c">环境优先：最后完成于 22 秒</text><text x="500" y="574.0" text-anchor="start" style="font-size:17px" fill="#203149">B 虽早结束，A 却晚启动 10 秒。</text><rect x="32" y="660" width="836" height="60" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="48" y="685.0" text-anchor="start" style="font-size:17px" fill="#008c7c">关键路径：决定最后结束时刻的依赖链。卡一直忙，也可能让整批更慢。</text></g></svg>