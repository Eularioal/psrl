<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 900 650"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677c"/></marker></defs><rect width="900" height="650" fill="white"/><g font-family="Droid Sans Fallback"><text x="32" y="38.0" text-anchor="start" style="font-size:26px" fill="#203149">卡归还了，积压请求为什么还没消失？</text><text x="32" y="74.0" text-anchor="start" style="font-size:17px" fill="#52677c">教学模型：请求持续以 6 个/秒到来；一个副本服务 4 个/秒，两个副本服务 8 个/秒。</text><line x1="32" y1="95" x2="868" y2="95" stroke="#dbe4ee" stroke-width="1.5"/><line x1="100" y1="415.0" x2="800" y2="415.0" stroke="#e1e8f0" stroke-width="1.5"/><text x="82" y="421.0" text-anchor="end" style="font-size:17px" fill="#52677c">0</text><line x1="100" y1="295.0" x2="800" y2="295.0" stroke="#e1e8f0" stroke-width="1.5"/><text x="82" y="301.0" text-anchor="end" style="font-size:17px" fill="#52677c">80</text><line x1="100" y1="175.0" x2="800" y2="175.0" stroke="#e1e8f0" stroke-width="1.5"/><text x="82" y="181.0" text-anchor="end" style="font-size:17px" fill="#52677c">160</text><line x1="100" y1="415" x2="800" y2="415" stroke="#52677c" stroke-width="1.5" marker-end="url(#arrow)"/><text x="32" y="143.0" text-anchor="start" style="font-size:18px" fill="#203149">排队请求数</text><polyline points="100,415 450.0,175 800,415" fill="none" stroke="#c8790c" stroke-width="3"/><circle cx="100" cy="415" r="5" fill="#c8790c"/><text x="100" y="443.0" text-anchor="middle" style="font-size:17px" fill="#52677c">0</text><circle cx="450.0" cy="175" r="5" fill="#c8790c"/><text x="450.0" y="443.0" text-anchor="middle" style="font-size:17px" fill="#52677c">80</text><circle cx="800" cy="415" r="5" fill="#c8790c"/><text x="800" y="443.0" text-anchor="middle" style="font-size:17px" fill="#52677c">160</text><text x="820" y="443.0" text-anchor="start" style="font-size:17px" fill="#52677c">秒</text><text x="130" y="500.0" text-anchor="start" style="font-size:20px" fill="#c8790c">0–80 秒：只留一个副本</text><text x="130" y="533.0" text-anchor="start" style="font-size:18px" fill="#203149">净增加 6 − 4 = 2 个/秒</text><text x="490" y="500.0" text-anchor="start" style="font-size:20px" fill="#276dc5">80–160 秒：恢复两个副本</text><text x="490" y="533.0" text-anchor="start" style="font-size:18px" fill="#203149">净消化 8 − 6 = 2 个/秒</text><text x="450" y="153.0" text-anchor="middle" style="font-size:18px" fill="#c8790c">第 80 秒归还，已积压 160 个</text><rect x="32" y="570" width="836" height="60" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="48" y="595.0" text-anchor="start" style="font-size:17px" fill="#008c7c">借卡影响可延续到归还之后。这里假定请求成本相同，真实队列还受合批与长度影响。</text></g></svg>