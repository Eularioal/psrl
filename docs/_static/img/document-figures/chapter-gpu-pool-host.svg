<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 900 660"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677c"/></marker></defs><rect width="900" height="660" fill="white"/><g font-family="Droid Sans Fallback"><text x="32" y="38.0" text-anchor="start" style="font-size:26px" fill="#203149">下一条命令换卡，容器和主存需要一起搬吗？</text><text x="32" y="74.0" text-anchor="start" style="font-size:17px" fill="#52677c">当前同机命令池的资源边界示意。A 是已有会话，B 是占用 A 原卡的其他命令。</text><line x1="32" y1="95" x2="868" y2="95" stroke="#dbe4ee" stroke-width="1.5"/><rect x="32" y="130" width="836" height="165" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="52" y="168.0" text-anchor="start" style="font-size:23px" fill="#276dc5">节点 N：会话 A 的主机资源不动</text><rect x="52" y="197" width="245" height="60" rx="10" fill="white" stroke="#276dc5" stroke-width="1.5"/><text x="174" y="234.0" text-anchor="middle" style="font-size:20px" fill="#276dc5">容器与工作文件</text><rect x="317" y="197" width="245" height="60" rx="10" fill="white" stroke="#276dc5" stroke-width="1.5"/><text x="439" y="234.0" text-anchor="middle" style="font-size:20px" fill="#276dc5">CPU 配额</text><rect x="582" y="197" width="245" height="60" rx="10" fill="white" stroke="#276dc5" stroke-width="1.5"/><text x="704" y="234.0" text-anchor="middle" style="font-size:20px" fill="#276dc5">主存与进程状态</text><rect x="32" y="359" width="400" height="165" rx="10" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="52" y="395.0" text-anchor="start" style="font-size:22px" fill="#c8790c">GPU0：原卡</text><text x="52" y="440.0" text-anchor="start" style="font-size:20px" fill="#203149">B 正在执行</text><text x="52" y="470.0" text-anchor="start" style="font-size:20px" fill="#203149">A 可以等待</text><rect x="468" y="359" width="400" height="165" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="488" y="395.0" text-anchor="start" style="font-size:22px" fill="#008c7c">GPU1：同机候选</text><text x="488" y="440.0" text-anchor="start" style="font-size:20px" fill="#203149">容量允许时</text><text x="488" y="470.0" text-anchor="start" style="font-size:20px" fill="#203149">A 可在此执行下一条命令</text><line x1="260" y1="299" x2="665" y2="349" stroke="#008c7c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="32" y="580" width="836" height="60" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="48" y="605.0" text-anchor="start" style="font-size:17px" fill="#008c7c">移动的是下一条命令的设备授权。活 GPU 状态不透明迁移，跨节点还需另管文件与状态。</text></g></svg>