   <g id="text_25">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #159b8d" x="61.9776" y="1061.478797" transform="rotate(-0 61.9776 1061.478797)">统一执行与资源语义可以减少重复，同时保留容器创建方式的差异。统一不等于删成一个类。</text>
   </g>
   <g id="text_26">
    <text style="font-size: 18px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #53677c" x="46.08" y="1121.928117" transform="rotate(-0 46.08 1121.928117)">图解释职责边界。哪些接口已接入正式路径、哪些仍是研究模块，以正文核对为准。</text>
