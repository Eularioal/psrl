   </g>
   <g id="text_14">
    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #203149" x="374.6304" y="720.214922" transform="rotate(-0 374.6304 720.214922)">Compose：按项目创建</text>
   </g>
   <g id="text_15">
    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #203149" x="374.6304" y="750.859297" transform="rotate(-0 374.6304 750.859297)">native：按自身接口创建</text>
   </g>
   <g id="text_16">
    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #203149" x="374.6304" y="779.980234" transform="rotate(-0 374.6304 779.980234)">保留各自生命周期责任</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 21px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #159b8d" x="67.2768" y="836.05623" transform="rotate(-0 67.2768 836.05623)">02  共用执行协议</text>
   </g>
   <g id="text_18">
    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #203149" x="374.6304" y="831.663984" transform="rotate(-0 374.6304 831.663984)">提交、查询、等待命令</text>
   </g>
   <g id="text_19">
    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #203149" x="374.6304" y="860.941172" transform="rotate(-0 374.6304 860.941172)">取消与超时传播</text>
   </g>
   <g id="text_20">
    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #203149" x="374.6304" y="890.140234" transform="rotate(-0 374.6304 890.140234)">设备预算及归还确认</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 21px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #d68b20" x="67.2768" y="946.298262" transform="rotate(-0 67.2768 946.298262)">03  任务结束</text>
   </g>
   <g id="text_22">
    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #203149" x="374.6304" y="942.019297" transform="rotate(-0 374.6304 942.019297)">停止所属执行进程</text>
   </g>
   <g id="text_23">
    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #203149" x="374.6304" y="971.179297" transform="rotate(-0 374.6304 971.179297)">核实物理 GPU 释放</text>
