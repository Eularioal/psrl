   <g id="text_19">
    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #203149" x="374.6304" y="721.699297" transform="rotate(-0 374.6304 721.699297)">控制谁可以持卡</text>
