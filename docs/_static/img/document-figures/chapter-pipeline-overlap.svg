<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1400" viewBox="0 0 900 700"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677c"/></marker></defs><rect width="900" height="700" fill="white"/><g font-family="Droid Sans Fallback"><text x="32" y="38.0" text-anchor="start" style="font-size:26px" fill="#203149">采样与训练重叠，省掉的是哪段等待？</text><text x="32" y="74.0" text-anchor="start" style="font-size:17px" fill="#52677c">教学假设：每批采样 12 秒、训练 4 秒，三批工作不变，忽略参数同步成本。</text><line x1="32" y1="95" x2="868" y2="95" stroke="#dbe4ee" stroke-width="1.5"/><text x="32" y="110.0" text-anchor="start" style="font-size:16px" fill="#52677c">同一时间轴（秒）</text><text x="155.0" y="138.0" text-anchor="middle" style="font-size:16px" fill="#52677c">0</text><line x1="155.0" y1="148" x2="155.0" y2="383" stroke="#e2e8f0" stroke-width="1.5"/><text x="326.25" y="138.0" text-anchor="middle" style="font-size:16px" fill="#52677c">12</text><line x1="326.25" y1="148" x2="326.25" y2="383" stroke="#e2e8f0" stroke-width="1.5"/><text x="497.5" y="138.0" text-anchor="middle" style="font-size:16px" fill="#52677c">24</text><line x1="497.5" y1="148" x2="497.5" y2="383" stroke="#e2e8f0" stroke-width="1.5"/><text x="668.75" y="138.0" text-anchor="middle" style="font-size:16px" fill="#52677c">36</text><line x1="668.75" y1="148" x2="668.75" y2="383" stroke="#e2e8f0" stroke-width="1.5"/><text x="840.0" y="138.0" text-anchor="middle" style="font-size:16px" fill="#52677c">48</text><line x1="840.0" y1="148" x2="840.0" y2="383" stroke="#e2e8f0" stroke-width="1.5"/><text x="32" y="190.0" text-anchor="start" style="font-size:18px" fill="#203149">串行</text><line x1="155" y1="203" x2="840" y2="203" stroke="#e2e8f0" stroke-width="1.5"/><rect x="155.0" y="165" width="171.25" height="38" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="240.625" y="190.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">采样1</text><rect x="326.25" y="165" width="57.083333333333336" height="38" rx="3" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="354.7916666666667" y="190.0" text-anchor="middle" style="font-size:17px" fill="#c8790c">训1</text><rect x="383.33333333333337" y="165" width="171.25" height="38" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="468.95833333333337" y="190.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">采样2</text><rect x="554.5833333333334" y="165" width="57.083333333333336" height="38" rx="3" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="583.125" y="190.0" text-anchor="middle" style="font-size:17px" fill="#c8790c">训2</text><rect x="611.6666666666667" y="165" width="171.25" height="38" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="697.2916666666667" y="190.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">采样3</text><rect x="782.9166666666667" y="165" width="57.083333333333336" height="38" rx="3" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="811.4583333333334" y="190.0" text-anchor="middle" style="font-size:17px" fill="#c8790c">训3</text><text x="32" y="260.0" text-anchor="start" style="font-size:18px" fill="#203149">重叠：采样</text><line x1="155" y1="273" x2="840" y2="273" stroke="#e2e8f0" stroke-width="1.5"/><rect x="155.0" y="235" width="171.25" height="38" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="240.625" y="260.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">采样1</text><rect x="326.25" y="235" width="171.25" height="38" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="411.875" y="260.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">采样2</text><rect x="497.5" y="235" width="171.25" height="38" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="583.125" y="260.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">采样3</text><text x="32" y="330.0" text-anchor="start" style="font-size:18px" fill="#203149">重叠：训练</text><line x1="155" y1="343" x2="840" y2="343" stroke="#e2e8f0" stroke-width="1.5"/><rect x="326.25" y="305" width="57.083333333333336" height="38" rx="3" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="354.7916666666667" y="330.0" text-anchor="middle" style="font-size:17px" fill="#c8790c">训1</text><rect x="497.5" y="305" width="57.083333333333336" height="38" rx="3" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="526.0416666666666" y="330.0" text-anchor="middle" style="font-size:17px" fill="#c8790c">训2</text><rect x="668.75" y="305" width="57.083333333333336" height="38" rx="3" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="697.2916666666666" y="330.0" text-anchor="middle" style="font-size:17px" fill="#c8790c">训3</text><text x="32" y="475.0" text-anchor="start" style="font-size:21px" fill="#276dc5">完全串行：3 × (12 + 4) = 48 秒。</text><text x="32" y="520.0" text-anchor="start" style="font-size:20px" fill="#008c7c">允许重叠：12 + 12 + 12 + 4 = 40 秒，最后一批训练仍要做。</text><rect x="32" y="620" width="836" height="60" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="48" y="645.0" text-anchor="start" style="font-size:17px" fill="#008c7c">条件：算法允许稍旧参数采样。若下一批必须用刚更新的参数，这种重叠就不合法。</text></g></svg>