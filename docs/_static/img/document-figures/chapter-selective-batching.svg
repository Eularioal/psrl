<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1380" viewBox="0 0 900 690"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677c"/></marker></defs><rect width="900" height="690" fill="white"/><g font-family="Droid Sans Fallback"><text x="32" y="38.0" text-anchor="start" style="font-size:26px" fill="#203149">投影可以合批，attention 仍要记住每条请求的边界</text><text x="32" y="74.0" text-anchor="start" style="font-size:17px" fill="#52677c">教学例子：A、B 各 decode 1 个 token，C prefill 4 个 token，共 6 行投影输入。</text><line x1="32" y1="95" x2="868" y2="95" stroke="#dbe4ee" stroke-width="1.5"/><rect x="50" y="145" width="95" height="36" rx="2" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="97" y="170.0" text-anchor="middle" style="font-size:19px" fill="#276dc5">A</text><rect x="50" y="187" width="95" height="36" rx="2" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="97" y="212.0" text-anchor="middle" style="font-size:19px" fill="#008c7c">B</text><rect x="50" y="229" width="95" height="36" rx="2" fill="#f1ebfa" stroke="#7950b4" stroke-width="1.5"/><text x="97" y="254.0" text-anchor="middle" style="font-size:19px" fill="#7950b4">C1</text><rect x="50" y="271" width="95" height="36" rx="2" fill="#f1ebfa" stroke="#7950b4" stroke-width="1.5"/><text x="97" y="296.0" text-anchor="middle" style="font-size:19px" fill="#7950b4">C2</text><rect x="50" y="313" width="95" height="36" rx="2" fill="#f1ebfa" stroke="#7950b4" stroke-width="1.5"/><text x="97" y="338.0" text-anchor="middle" style="font-size:19px" fill="#7950b4">C3</text><rect x="50" y="355" width="95" height="36" rx="2" fill="#f1ebfa" stroke="#7950b4" stroke-width="1.5"/><text x="97" y="380.0" text-anchor="middle" style="font-size:19px" fill="#7950b4">C4</text><text x="50" y="440.0" text-anchor="start" style="font-size:19px" fill="#203149">6 个新 token</text><line x1="155" y1="266" x2="230" y2="266" stroke="#52677c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="242" y="180" width="220" height="180" rx="10" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="352" y="220.0" text-anchor="middle" style="font-size:21px" fill="#c8790c">共享投影权重 W</text><line x1="269" y1="244" x2="269" y2="330" stroke="#c8790c" stroke-width="1.5"/><line x1="269" y1="246" x2="392" y2="246" stroke="#c8790c" stroke-width="1.5"/><line x1="310" y1="244" x2="310" y2="330" stroke="#c8790c" stroke-width="1.5"/><line x1="269" y1="273" x2="392" y2="273" stroke="#c8790c" stroke-width="1.5"/><line x1="351" y1="244" x2="351" y2="330" stroke="#c8790c" stroke-width="1.5"/><line x1="269" y1="300" x2="392" y2="300" stroke="#c8790c" stroke-width="1.5"/><line x1="392" y1="244" x2="392" y2="330" stroke="#c8790c" stroke-width="1.5"/><line x1="269" y1="327" x2="392" y2="327" stroke="#c8790c" stroke-width="1.5"/><text x="242" y="408.0" text-anchor="start" style="font-size:18px" fill="#203149">沿 token 维拼成一次矩阵计算</text><line x1="468" y1="266" x2="525" y2="266" stroke="#52677c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="545" y="150" width="320" height="70" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="561" y="192.0" text-anchor="start" style="font-size:18px" fill="#276dc5">A → 只读 A 的历史 KV</text><rect x="545" y="250" width="320" height="70" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="561" y="292.0" text-anchor="start" style="font-size:18px" fill="#008c7c">B → 只读 B 的历史 KV</text><rect x="545" y="350" width="320" height="70" rx="10" fill="#f1ebfa" stroke="#7950b4" stroke-width="1.5"/><text x="561" y="392.0" text-anchor="start" style="font-size:18px" fill="#7950b4">C → 只读 C，保留因果遮罩</text><text x="32" y="527.0" text-anchor="start" style="font-size:21px" fill="#203149">合批复用权重读取；请求边界保证 A 不会看到 B 的历史。</text><rect x="32" y="610" width="836" height="60" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="48" y="635.0" text-anchor="start" style="font-size:17px" fill="#008c7c">这是算子分工示意，具体内核可融合执行。合成一个矩阵不等于合并会话语义。</text></g></svg>