<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1340" viewBox="0 0 900 670"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677c"/></marker></defs><rect width="900" height="670" fill="white"/><g font-family="Droid Sans Fallback"><text x="32" y="38.0" text-anchor="start" style="font-size:26px" fill="#203149">借用空档：要装下整段交接，而不只是环境计算</text><text x="32" y="74.0" text-anchor="start" style="font-size:17px" fill="#52677c">教学假设：从现在起，模型预计到第 60 秒才有新请求；B 是等待 GPU 的环境命令。</text><line x1="32" y1="95" x2="868" y2="95" stroke="#dbe4ee" stroke-width="1.5"/><text x="32" y="110.0" text-anchor="start" style="font-size:16px" fill="#52677c">同一时间轴（秒）</text><text x="155.0" y="138.0" text-anchor="middle" style="font-size:16px" fill="#52677c">0</text><line x1="155.0" y1="148" x2="155.0" y2="243" stroke="#e2e8f0" stroke-width="1.5"/><text x="189.25" y="138.0" text-anchor="middle" style="font-size:16px" fill="#52677c">3</text><line x1="189.25" y1="148" x2="189.25" y2="243" stroke="#e2e8f0" stroke-width="1.5"/><text x="531.75" y="138.0" text-anchor="middle" style="font-size:16px" fill="#52677c">33</text><line x1="531.75" y1="148" x2="531.75" y2="243" stroke="#e2e8f0" stroke-width="1.5"/><text x="554.5833333333333" y="138.0" text-anchor="middle" style="font-size:16px" fill="#52677c">35</text><line x1="554.5833333333333" y1="148" x2="554.5833333333333" y2="243" stroke="#e2e8f0" stroke-width="1.5"/><text x="611.6666666666666" y="138.0" text-anchor="middle" style="font-size:16px" fill="#52677c">40</text><line x1="611.6666666666666" y1="148" x2="611.6666666666666" y2="243" stroke="#e2e8f0" stroke-width="1.5"/><text x="840.0" y="138.0" text-anchor="middle" style="font-size:16px" fill="#52677c">60</text><line x1="840.0" y1="148" x2="840.0" y2="243" stroke="#e2e8f0" stroke-width="1.5"/><text x="32" y="190.0" text-anchor="start" style="font-size:18px" fill="#203149">卡的用途</text><line x1="155" y1="203" x2="840" y2="203" stroke="#e2e8f0" stroke-width="1.5"/><rect x="155.0" y="165" width="34.25" height="38" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><rect x="189.25" y="165" width="342.5" height="38" rx="3" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="360.5" y="190.0" text-anchor="middle" style="font-size:17px" fill="#008c7c">B 计算：30 秒</text><rect x="531.75" y="165" width="22.833333333333332" height="38" rx="3" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><rect x="554.5833333333333" y="165" width="57.08333333333333" height="38" rx="3" fill="#f1ebfa" stroke="#7950b4" stroke-width="1.5"/><rect x="611.6666666666666" y="165" width="228.33333333333331" height="38" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="725.8333333333333" y="190.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">模型已就绪</text><rect x="32" y="300" width="188" height="100" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="48" y="333.0" text-anchor="start" style="font-size:20px" fill="#276dc5">卸载 3 秒</text><text x="48" y="375.0" text-anchor="start" style="font-size:18px" fill="#203149">0 → 3</text><rect x="248" y="300" width="188" height="100" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="264" y="333.0" text-anchor="start" style="font-size:20px" fill="#008c7c">计算 30 秒</text><text x="264" y="375.0" text-anchor="start" style="font-size:18px" fill="#203149">3 → 33</text><rect x="464" y="300" width="188" height="100" rx="10" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="480" y="333.0" text-anchor="start" style="font-size:20px" fill="#c8790c">清理 2 秒</text><text x="480" y="375.0" text-anchor="start" style="font-size:18px" fill="#203149">33 → 35</text><rect x="680" y="300" width="188" height="100" rx="10" fill="#f1ebfa" stroke="#7950b4" stroke-width="1.5"/><text x="696" y="333.0" text-anchor="start" style="font-size:20px" fill="#7950b4">恢复 5 秒</text><text x="696" y="375.0" text-anchor="start" style="font-size:18px" fill="#203149">35 → 40</text><text x="32" y="454.0" text-anchor="start" style="font-size:20px" fill="#203149">保守筛选：3 + 30 + 2 + 5 + 安全余量 5 = 45 秒 ≤ 60 秒。</text><text x="32" y="503.0" text-anchor="start" style="font-size:20px" fill="#c64760">若请求提前到第 8 秒：模型要等到第 40 秒，多等 32 秒。</text><rect x="32" y="590" width="836" height="60" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="48" y="615.0" text-anchor="start" style="font-size:17px" fill="#008c7c">空档预测会错。严格限制等待还需要有界归还能力，普通长命令不能瞬间撤回。</text></g></svg>