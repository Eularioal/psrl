<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 900 650"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677c"/></marker></defs><rect width="900" height="650" fill="white"/><g font-family="Droid Sans Fallback"><text x="32" y="38.0" text-anchor="start" style="font-size:26px" fill="#203149">“已经预热”到底保留了哪一层？</text><text x="32" y="74.0" text-anchor="start" style="font-size:17px" fill="#52677c">机制示意：越往下保留的准备越多，但占用资源和版本管理责任也越多。</text><line x1="32" y1="95" x2="868" y2="95" stroke="#dbe4ee" stroke-width="1.5"/><text x="32" y="158.0" text-anchor="start" style="font-size:20px" fill="#276dc5">容器已就绪</text><rect x="230" y="130" width="170" height="50" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="315" y="162.0" text-anchor="middle" style="font-size:19px" fill="#276dc5">镜像</text><rect x="420" y="130" width="170" height="50" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="505" y="162.0" text-anchor="middle" style="font-size:19px" fill="#276dc5">依赖</text><rect x="610" y="130" width="170" height="50" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="695" y="162.0" text-anchor="middle" style="font-size:19px" fill="#276dc5">工作目录</text><text x="230" y="218.0" text-anchor="start" style="font-size:18px" fill="#203149">仍可能要启动 Python、读权重</text><text x="32" y="303.0" text-anchor="start" style="font-size:20px" fill="#c8790c">CPU 进程常驻</text><rect x="230" y="275" width="170" height="50" rx="10" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="315" y="307.0" text-anchor="middle" style="font-size:19px" fill="#c8790c">已导入库</text><rect x="420" y="275" width="170" height="50" rx="10" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="505" y="307.0" text-anchor="middle" style="font-size:19px" fill="#c8790c">数据</text><rect x="610" y="275" width="170" height="50" rx="10" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="695" y="307.0" text-anchor="middle" style="font-size:19px" fill="#c8790c">CPU 权重</text><text x="230" y="363.0" text-anchor="start" style="font-size:18px" fill="#203149">可省部分准备，仍可能要传到 GPU</text><text x="32" y="448.0" text-anchor="start" style="font-size:20px" fill="#008c7c">GPU 模型常驻</text><rect x="230" y="420" width="170" height="50" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="315" y="452.0" text-anchor="middle" style="font-size:19px" fill="#008c7c">权重</text><rect x="420" y="420" width="170" height="50" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="505" y="452.0" text-anchor="middle" style="font-size:19px" fill="#008c7c">缓存</text><rect x="610" y="420" width="170" height="50" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="695" y="452.0" text-anchor="middle" style="font-size:19px" fill="#008c7c">执行状态</text><text x="230" y="508.0" text-anchor="start" style="font-size:18px" fill="#203149">可更快继续，但持续占显存</text><rect x="32" y="570" width="836" height="60" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="48" y="595.0" text-anchor="start" style="font-size:17px" fill="#008c7c">容器复用、进程复用、模型复用分别验收。Firepool 的 warm pod 不等于常驻 GPU 模型。</text></g></svg>