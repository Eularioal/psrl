<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1380" viewBox="0 0 900 690"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677c"/></marker></defs><rect width="900" height="690" fill="white"/><g font-family="Droid Sans Fallback"><text x="32" y="38.0" text-anchor="start" style="font-size:26px" fill="#203149">另一台机器有空卡，为什么这组任务还在本机排队？</text><text x="32" y="74.0" text-anchor="start" style="font-size:17px" fill="#52677c">当前 Science/Harbor 路径示意：同题 8 条先作为一组派给 worker，之后申请限定本节点。</text><line x1="32" y1="95" x2="868" y2="95" stroke="#dbe4ee" stroke-width="1.5"/><rect x="32" y="140" width="400" height="360" rx="10" fill="white" stroke="#276dc5" stroke-width="1.5"/><text x="52" y="178.0" text-anchor="start" style="font-size:21px" fill="#276dc5">节点 A：本组 worker 在这里</text><text x="52" y="217.0" text-anchor="start" style="font-size:18px" fill="#203149">环境槽位</text><rect x="54" y="239" width="78" height="62" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="93" y="278.0" text-anchor="middle" style="font-size:21px" fill="#276dc5">R1</text><rect x="146" y="239" width="78" height="62" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="185" y="278.0" text-anchor="middle" style="font-size:21px" fill="#276dc5">R2</text><rect x="238" y="239" width="78" height="62" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="277" y="278.0" text-anchor="middle" style="font-size:21px" fill="#276dc5">R3</text><rect x="330" y="239" width="78" height="62" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="369" y="278.0" text-anchor="middle" style="font-size:21px" fill="#276dc5">R4</text><text x="52" y="351.0" text-anchor="start" style="font-size:21px" fill="#c8790c">R5、R6、R7、R8 等待</text><text x="52" y="394.0" text-anchor="start" style="font-size:19px" fill="#203149">重试仍携带 node_ip=A</text><text x="52" y="441.0" text-anchor="start" style="font-size:19px" fill="#203149">重新检查 A，不重派到 B</text><rect x="468" y="140" width="400" height="360" rx="10" fill="white" stroke="#008c7c" stroke-width="1.5"/><text x="488" y="178.0" text-anchor="start" style="font-size:21px" fill="#008c7c">节点 B：另有空闲资源</text><text x="488" y="217.0" text-anchor="start" style="font-size:18px" fill="#203149">环境槽位</text><rect x="490" y="239" width="78" height="62" rx="10" fill="#f0f4f8" stroke="#b5c3d2" stroke-width="1.5"/><text x="529" y="278.0" text-anchor="middle" style="font-size:21px" fill="#008c7c">空</text><rect x="582" y="239" width="78" height="62" rx="10" fill="#f0f4f8" stroke="#b5c3d2" stroke-width="1.5"/><text x="621" y="278.0" text-anchor="middle" style="font-size:21px" fill="#008c7c">空</text><rect x="674" y="239" width="78" height="62" rx="10" fill="#f0f4f8" stroke="#b5c3d2" stroke-width="1.5"/><text x="713" y="278.0" text-anchor="middle" style="font-size:21px" fill="#008c7c">空</text><rect x="766" y="239" width="78" height="62" rx="10" fill="#f0f4f8" stroke="#b5c3d2" stroke-width="1.5"/><text x="805" y="278.0" text-anchor="middle" style="font-size:21px" fill="#008c7c">空</text><text x="488" y="351.0" text-anchor="start" style="font-size:21px" fill="#008c7c">Router 知道 B 的容量</text><text x="488" y="394.0" text-anchor="start" style="font-size:19px" fill="#203149">但本次申请的候选只含 A</text><text x="488" y="441.0" text-anchor="start" style="font-size:19px" fill="#203149">当前没有跨节点接续重派</text><rect x="32" y="610" width="836" height="60" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="48" y="635.0" text-anchor="start" style="font-size:17px" fill="#008c7c">同机命令换卡与跨节点迁移是两回事。前者保留容器，后者还要处理文件和执行位置。</text></g></svg>