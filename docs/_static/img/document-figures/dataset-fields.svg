   <g id="text_14">
    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #203149" x="374.6304" y="778.886484" transform="rotate(-0 374.6304 778.886484)">extra_info：struct</text>
