<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 900 650"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677c"/></marker></defs><rect width="900" height="650" fill="white"/><g font-family="Droid Sans Fallback"><text x="32" y="38.0" text-anchor="start" style="font-size:26px" fill="#203149">重复测得很稳定，也可能稳定地选错代码</text><text x="32" y="74.0" text-anchor="start" style="font-size:17px" fill="#52677c">教学假设：A、B 的竞争敏感度不同。横条越短越快，单位毫秒。</text><line x1="32" y1="95" x2="868" y2="95" stroke="#dbe4ee" stroke-width="1.5"/><text x="32" y="150.0" text-anchor="start" style="font-size:22px" fill="#203149">无竞争目标</text><text x="55" y="202.0" text-anchor="start" style="font-size:22px" fill="#276dc5">A</text><rect x="105" y="175" width="516.6666666666666" height="38" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="636.6666666666666" y="201.0" text-anchor="start" style="font-size:19px" fill="#276dc5">10 ms</text><text x="55" y="259.0" text-anchor="start" style="font-size:22px" fill="#008c7c">B</text><rect x="105" y="232" width="527.0" height="38" rx="3" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="647.0" y="258.0" text-anchor="start" style="font-size:19px" fill="#008c7c">10.2 ms</text><text x="32" y="330.0" text-anchor="start" style="font-size:22px" fill="#203149">共享环境观测</text><text x="55" y="382.0" text-anchor="start" style="font-size:22px" fill="#276dc5">A</text><rect x="105" y="355" width="568.3333333333334" height="38" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="688.3333333333334" y="381.0" text-anchor="start" style="font-size:19px" fill="#276dc5">11 ms</text><text x="55" y="439.0" text-anchor="start" style="font-size:22px" fill="#008c7c">B</text><rect x="105" y="412" width="532.27" height="38" rx="3" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="652.27" y="438.0" text-anchor="start" style="font-size:19px" fill="#008c7c">10.302 ms</text><text x="32" y="542.0" text-anchor="start" style="font-size:19px" fill="#c64760">目标应选 A；共享时却选 B。多次取中位数也消不掉这种系统偏差。</text><rect x="32" y="570" width="836" height="60" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="48" y="595.0" text-anchor="start" style="font-size:17px" fill="#008c7c">时间作为评分时，要控制测量条件；环境吞吐和反馈质量必须分别验证。</text></g></svg>