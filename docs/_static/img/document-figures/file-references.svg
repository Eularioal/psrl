    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #203149" x="374.6304" y="941.863047" transform="rotate(-0 374.6304 941.863047)">打开引用也归零</text>
   </g>
   <g id="text_24">
    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #203149" x="374.6304" y="971.257422" transform="rotate(-0 374.6304 971.257422)">对象才具备回收条件</text>
   </g>
   <g id="text_25">
    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #203149" x="374.6304" y="999.479922" transform="rotate(-0 374.6304 999.479922)">复制文件会产生新对象 J</text>
   </g>
  </g>
