   <g id="text_26">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #159b8d" x="61.9776" y="1061.556922" transform="rotate(-0 61.9776 1061.556922)">名字是查找入口，打开引用是进程的使用权。删除入口不等于立即销毁正在使用的对象。</text>
