<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 900 650"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677c"/></marker></defs><rect width="900" height="650" fill="white"/><g font-family="Droid Sans Fallback"><text x="32" y="38.0" text-anchor="start" style="font-size:26px" fill="#203149">结果已经打印出来，卡为什么还不能交给下一条命令？</text><text x="32" y="74.0" text-anchor="start" style="font-size:17px" fill="#52677c">机制示意：输出就绪与物理归还是两个事件；背景 GPU 进程仍可能持有显存。</text><line x1="32" y1="95" x2="868" y2="95" stroke="#dbe4ee" stroke-width="1.5"/><rect x="32" y="155" width="264" height="244" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="50" y="193.0" text-anchor="start" style="font-size:22px" fill="#276dc5">① 输出可读</text><text x="50" y="228.0" text-anchor="start" style="font-size:16px" fill="#203149">旧子进程仍占显存</text><rect x="50" y="241" width="51" height="39" rx="2" fill="#276dc5" stroke="#276dc5" stroke-width="1.5"/><rect x="107" y="241" width="51" height="39" rx="2" fill="#276dc5" stroke="#276dc5" stroke-width="1.5"/><rect x="164" y="241" width="51" height="39" rx="2" fill="#276dc5" stroke="#276dc5" stroke-width="1.5"/><rect x="221" y="241" width="51" height="39" rx="2" fill="#276dc5" stroke="#276dc5" stroke-width="1.5"/><text x="50" y="301.0" text-anchor="start" style="font-size:16px" fill="#276dc5">尚不能承诺给下一条命令</text><text x="50" y="344.0" text-anchor="start" style="font-size:17px" fill="#203149">stdout / 文件可返回</text><text x="50" y="373.0" text-anchor="start" style="font-size:17px" fill="#203149">GPU 子进程可能仍活着</text><rect x="318" y="155" width="264" height="244" rx="10" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="336" y="193.0" text-anchor="start" style="font-size:22px" fill="#c8790c">② 撤权并清理</text><text x="336" y="228.0" text-anchor="start" style="font-size:16px" fill="#203149">清理中：占用逐步退出</text><rect x="336" y="241" width="51" height="39" rx="2" fill="#c8790c" stroke="#c8790c" stroke-width="1.5"/><rect x="393" y="241" width="51" height="39" rx="2" fill="#c8790c" stroke="#c8790c" stroke-width="1.5"/><rect x="450" y="241" width="51" height="39" rx="2" fill="white" stroke="#CBD5E1" stroke-width="1.5"/><rect x="507" y="241" width="51" height="39" rx="2" fill="white" stroke="#CBD5E1" stroke-width="1.5"/><text x="336" y="301.0" text-anchor="start" style="font-size:16px" fill="#c8790c">尚不能承诺给下一条命令</text><text x="336" y="344.0" text-anchor="start" style="font-size:17px" fill="#203149">阻止新的设备访问</text><text x="336" y="373.0" text-anchor="start" style="font-size:17px" fill="#203149">等待旧句柄与进程退出</text><rect x="604" y="155" width="264" height="244" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="622" y="193.0" text-anchor="start" style="font-size:22px" fill="#008c7c">③ 资源可复用</text><text x="622" y="228.0" text-anchor="start" style="font-size:16px" fill="#203149">核对完成：旧占用已清空</text><rect x="622" y="241" width="51" height="39" rx="2" fill="white" stroke="#CBD5E1" stroke-width="1.5"/><rect x="679" y="241" width="51" height="39" rx="2" fill="white" stroke="#CBD5E1" stroke-width="1.5"/><rect x="736" y="241" width="51" height="39" rx="2" fill="white" stroke="#CBD5E1" stroke-width="1.5"/><rect x="793" y="241" width="51" height="39" rx="2" fill="white" stroke="#CBD5E1" stroke-width="1.5"/><text x="622" y="301.0" text-anchor="start" style="font-size:16px" fill="#008c7c">此时才可发出新的承诺</text><text x="622" y="344.0" text-anchor="start" style="font-size:17px" fill="#203149">核对旧占用已经退出</text><text x="622" y="373.0" text-anchor="start" style="font-size:17px" fill="#203149">再释放账本与共享票据</text><text x="32" y="464.0" text-anchor="start" style="font-size:20px" fill="#c64760">若清理失败：保持隔离并报告失败，不能只把预约数改成零。</text><rect x="32" y="570" width="836" height="60" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="48" y="595.0" text-anchor="start" style="font-size:17px" fill="#008c7c">账本释放描述“可以再承诺”；物理释放证明“旧程序已让出资源”。两者顺序很重要。</text></g></svg>