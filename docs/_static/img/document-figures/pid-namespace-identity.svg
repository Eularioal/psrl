   <g id="text_14">
    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #203149" x="374.6304" y="721.543047" transform="rotate(-0 374.6304 721.543047)">A：PID 12</text>
   </g>
   <g id="text_15">
    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #203149" x="374.6304" y="750.703047" transform="rotate(-0 374.6304 750.703047)">B：PID 12</text>
   </g>
   <g id="text_16">
    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #203149" x="374.6304" y="779.980234" transform="rotate(-0 374.6304 779.980234)">局部编号相同不等于同进程</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 21px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #159b8d" x="67.2768" y="836.138262" transform="rotate(-0 67.2768 836.138262)">02  建立可信映射</text>
   </g>
   <g id="text_18">
    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #203149" x="374.6304" y="830.453047" transform="rotate(-0 374.6304 830.453047)">核对命名空间与 cgroup</text>
   </g>
   <g id="text_19">
    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #203149" x="374.6304" y="861.019297" transform="rotate(-0 374.6304 861.019297)">记录宿主 PID 与出生身份</text>
   </g>
   <g id="text_20">
    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #203149" x="374.6304" y="890.179297" transform="rotate(-0 374.6304 890.179297)">关联本次任务归属</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 21px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #d68b20" x="67.2768" y="946.339277" transform="rotate(-0 67.2768 946.339277)">03  执行取消前</text>
   </g>
   <g id="text_22">
    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #203149" x="374.6304" y="942.136484" transform="rotate(-0 374.6304 942.136484)">重新核实进程仍是原对象</text>
   </g>
   <g id="text_23">
    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #203149" x="374.6304" y="971.062109" transform="rotate(-0 374.6304 971.062109)">只处理所属资源</text>
   </g>
   <g id="text_24">
    <text style="font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #203149" x="374.6304" y="1000.300234" transform="rotate(-0 374.6304 1000.300234)">PID 被复用时拒绝误取消</text>
   </g>
  </g>
