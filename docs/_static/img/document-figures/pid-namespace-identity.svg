    <text style="font-weight: 700; font-size: 20px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #159b8d" x="61.9776" y="1061.478797" transform="rotate(-0 61.9776 1061.478797)">进程身份包含所在空间与出生信息。裸 PID 既会跨空间重复，也会在退出后被复用。</text>
   </g>
   <g id="text_26">
    <text style="font-size: 18px; font-family: 'Droid Sans Fallback', 'DejaVu Sans'; text-anchor: start; fill: #53677c" x="46.08" y="1121.928117" transform="rotate(-0 46.08 1121.928117)">编号均为教学示意。可信归属的当前实现范围按正文区分，不扩大能力。</text>
