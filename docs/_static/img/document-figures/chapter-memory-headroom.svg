<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 900 650"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677c"/></marker></defs><rect width="900" height="650" fill="white"/><g font-family="Droid Sans Fallback"><text x="32" y="38.0" text-anchor="start" style="font-size:26px" fill="#203149">看见 16 GiB 空闲，为什么只能再放 4 GiB？</text><text x="32" y="74.0" text-anchor="start" style="font-size:17px" fill="#52677c">教学预算：80 GiB 卡。已实占 64，另有尚未分配的承诺，不能把空闲全借出去。</text><line x1="32" y1="95" x2="868" y2="95" stroke="#dbe4ee" stroke-width="1.5"/><text x="32" y="140.0" text-anchor="start" style="font-size:21px" fill="#203149">① 物理占用：模型 56 + 环境 8 = 64 GiB</text><rect x="32" y="160" width="560.0" height="56" rx="0" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="312.0" y="194.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">模型实占 56</text><rect x="592.0" y="160" width="80.0" height="56" rx="0" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="632.0" y="194.0" text-anchor="middle" style="font-size:17px" fill="#008c7c">环境 8</text><rect x="672.0" y="160" width="160.0" height="56" rx="0" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="752.0" y="194.0" text-anchor="middle" style="font-size:17px" fill="#c8790c">空闲 16</text><text x="32" y="260.0" text-anchor="start" style="font-size:21px" fill="#203149">② 把空闲 16 GiB 按用途展开</text><rect x="32" y="282" width="200.0" height="72" rx="0" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="132.0" y="324.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">模型还可能用 4</text><rect x="232.0" y="282" width="200.0" height="72" rx="0" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="332.0" y="324.0" text-anchor="middle" style="font-size:17px" fill="#008c7c">环境已答应 4</text><rect x="432.0" y="282" width="200.0" height="72" rx="0" fill="#f1ebfa" stroke="#7950b4" stroke-width="1.5"/><text x="532.0" y="324.0" text-anchor="middle" style="font-size:17px" fill="#7950b4">安全余量 4</text><rect x="632.0" y="282" width="200.0" height="72" rx="0" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="732.0" y="324.0" text-anchor="middle" style="font-size:17px" fill="#c8790c">新命令最多 4</text><line x1="752" y1="219" x2="432" y2="272" stroke="#c8790c" stroke-width="1.5" marker-end="url(#arrow)"/><text x="32" y="406.0" text-anchor="start" style="font-size:20px" fill="#008c7c">新命令 4 GiB：64 + 4 + 4 + 4 + 4 = 80，容量允许。</text><text x="32" y="451.0" text-anchor="start" style="font-size:20px" fill="#c64760">新命令 8 GiB：总承诺 84，超过 80，等待。</text><text x="32" y="512.0" text-anchor="start" style="font-size:18px" fill="#203149">模型 KV 池内部的空槽仍属于模型，环境不能再次分配这份显存。</text><rect x="32" y="570" width="836" height="60" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="48" y="595.0" text-anchor="start" style="font-size:17px" fill="#008c7c">已有占用只计一次，未来增长另留预算。容量允许后，还要判断计算竞争。</text></g></svg>