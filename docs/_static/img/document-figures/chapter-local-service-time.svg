<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 900 550"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677c"/></marker></defs><rect width="900" height="550" fill="white"/><g font-family="Droid Sans Fallback"><text x="32" y="38.0" text-anchor="start" style="font-size:26px" fill="#203149">程序只算了 1 ms，为什么请求要等 24 ms？</text><text x="32" y="74.0" text-anchor="start" style="font-size:17px" fill="#52677c">教学假设：排队 20 ms、设备排空 3 ms、实际测量 1 ms，其他开销暂忽略。</text><line x1="32" y1="95" x2="868" y2="95" stroke="#dbe4ee" stroke-width="1.5"/><text x="32" y="125.0" text-anchor="start" style="font-size:16px" fill="#52677c">同一时间轴（毫秒）</text><text x="155.0" y="153.0" text-anchor="middle" style="font-size:16px" fill="#52677c">0</text><line x1="155.0" y1="163" x2="155.0" y2="258" stroke="#e2e8f0" stroke-width="1.5"/><text x="440.4166666666667" y="153.0" text-anchor="middle" style="font-size:16px" fill="#52677c">10</text><line x1="440.4166666666667" y1="163" x2="440.4166666666667" y2="258" stroke="#e2e8f0" stroke-width="1.5"/><text x="725.8333333333334" y="153.0" text-anchor="middle" style="font-size:16px" fill="#52677c">20</text><line x1="725.8333333333334" y1="163" x2="725.8333333333334" y2="258" stroke="#e2e8f0" stroke-width="1.5"/><text x="811.4583333333334" y="153.0" text-anchor="middle" style="font-size:16px" fill="#52677c">23</text><line x1="811.4583333333334" y1="163" x2="811.4583333333334" y2="258" stroke="#e2e8f0" stroke-width="1.5"/><text x="840.0" y="153.0" text-anchor="middle" style="font-size:16px" fill="#52677c">24</text><line x1="840.0" y1="163" x2="840.0" y2="258" stroke="#e2e8f0" stroke-width="1.5"/><text x="32" y="205.0" text-anchor="start" style="font-size:18px" fill="#203149">用户看到</text><line x1="155" y1="218" x2="840" y2="218" stroke="#e2e8f0" stroke-width="1.5"/><rect x="155.0" y="180" width="570.8333333333334" height="38" rx="3" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="440.4166666666667" y="205.0" text-anchor="middle" style="font-size:17px" fill="#c8790c">排队：20 ms</text><rect x="725.8333333333334" y="180" width="85.625" height="38" rx="3" fill="#f1ebfa" stroke="#7950b4" stroke-width="1.5"/><text x="768.6458333333334" y="205.0" text-anchor="middle" style="font-size:17px" fill="#7950b4">3 ms</text><rect x="811.4583333333334" y="180" width="28.541666666666668" height="38" rx="3" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><rect x="32" y="325" width="400" height="105" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="52" y="360.0" text-anchor="start" style="font-size:22px" fill="#008c7c">候选程序性能：1 ms</text><text x="52" y="400.0" text-anchor="start" style="font-size:18px" fill="#203149">回答“代码本身快不快”</text><rect x="468" y="325" width="400" height="105" rx="10" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="488" y="360.0" text-anchor="start" style="font-size:21px" fill="#c8790c">服务端到端延迟：至少 24 ms</text><text x="488" y="400.0" text-anchor="start" style="font-size:18px" fill="#203149">回答“结果何时拿得到”</text><rect x="32" y="470" width="836" height="60" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="48" y="495.0" text-anchor="start" style="font-size:17px" fill="#008c7c">两个时钟回答不同问题。只报其中一个，会漏掉代码质量或调度成本。</text></g></svg>