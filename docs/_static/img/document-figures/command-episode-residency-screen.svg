<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 900 540"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677c"/></marker></defs><rect width="900" height="540" fill="white"/><g font-family="Droid Sans Fallback"><text x="32" y="38.0" text-anchor="start" style="font-size:26px" fill="#203149">episode 与 command：空档时，GPU 预算留不留？</text><text x="32" y="74.0" text-anchor="start" style="font-size:17px" fill="#52677c">教学假设：同一会话 A 计算 20 秒、思考 10 秒、再计算 10 秒；B 正在等 GPU。</text><line x1="32" y1="95" x2="868" y2="95" stroke="#dbe4ee" stroke-width="1.5"/><text x="32" y="107.0" text-anchor="start" style="font-size:16px" fill="#52677c">同一时间轴（秒）</text><text x="155.0" y="135.0" text-anchor="middle" style="font-size:16px" fill="#52677c">0</text><line x1="155.0" y1="145" x2="155.0" y2="353" stroke="#e2e8f0" stroke-width="1.5"/><text x="497.5" y="135.0" text-anchor="middle" style="font-size:16px" fill="#52677c">20</text><line x1="497.5" y1="145" x2="497.5" y2="353" stroke="#e2e8f0" stroke-width="1.5"/><text x="668.75" y="135.0" text-anchor="middle" style="font-size:16px" fill="#52677c">30</text><line x1="668.75" y1="145" x2="668.75" y2="353" stroke="#e2e8f0" stroke-width="1.5"/><text x="840.0" y="135.0" text-anchor="middle" style="font-size:16px" fill="#52677c">40</text><line x1="840.0" y1="145" x2="840.0" y2="353" stroke="#e2e8f0" stroke-width="1.5"/><text x="32" y="187.0" text-anchor="start" style="font-size:18px" fill="#203149">A 的活动</text><line x1="155" y1="200" x2="840" y2="200" stroke="#e2e8f0" stroke-width="1.5"/><rect x="155.0" y="162" width="342.5" height="38" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="326.25" y="187.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">GPU 20 秒</text><rect x="497.5" y="162" width="171.25" height="38" rx="3" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="583.125" y="187.0" text-anchor="middle" style="font-size:17px" fill="#c8790c">思考 10 秒</text><rect x="668.75" y="162" width="171.25" height="38" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="754.375" y="187.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">GPU 10 秒</text><text x="32" y="248.0" text-anchor="start" style="font-size:18px" fill="#203149">episode</text><line x1="155" y1="261" x2="840" y2="261" stroke="#e2e8f0" stroke-width="1.5"/><rect x="155.0" y="223" width="685.0" height="38" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="497.5" y="248.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">GPU 预算全程留给 A</text><text x="32" y="309.0" text-anchor="start" style="font-size:18px" fill="#203149">command</text><line x1="155" y1="322" x2="840" y2="322" stroke="#e2e8f0" stroke-width="1.5"/><rect x="155.0" y="284" width="342.5" height="38" rx="3" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="326.25" y="309.0" text-anchor="middle" style="font-size:17px" fill="#008c7c">A 申请并使用</text><rect x="497.5" y="284" width="171.25" height="38" rx="3" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="583.125" y="309.0" text-anchor="middle" style="font-size:17px" fill="#c8790c">归还后可借 B</text><rect x="668.75" y="284" width="171.25" height="38" rx="3" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="754.375" y="309.0" text-anchor="middle" style="font-size:17px" fill="#008c7c">A 重新申请</text><text x="32" y="389.0" text-anchor="start" style="font-size:18px" fill="#203149">两种模式都保留容器、文件、CPU 和主存；保留预算不会自动保住已退出的模型进程。</text><text x="32" y="425.0" text-anchor="start" style="font-size:18px" fill="#203149">command 必须先确认物理归还；B 若没结束，A 回来仍需等待，图未计交接成本。</text><rect x="32" y="460" width="836" height="60" rx="10" fill="#f1ebfa" stroke="#7950b4" stroke-width="1.5"/><text x="48" y="485.0" text-anchor="start" style="font-size:17px" fill="#7950b4">auto 在会话准入时按可信能力与可选成本建议选择一种模式，租约内保持固定。</text></g></svg>