<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 900 660"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677c"/></marker></defs><rect width="900" height="660" fill="white"/><g font-family="Droid Sans Fallback"><text x="32" y="38.0" text-anchor="start" style="font-size:26px" fill="#203149">谁分资源，谁懂任务：中央层和应用层怎样配合？</text><text x="32" y="74.0" text-anchor="start" style="font-size:17px" fill="#52677c">YARN 启发的职责示意。这里描述分工，不声称 PSRL 已实现完整应用级性能调度。</text><line x1="32" y1="95" x2="868" y2="95" stroke="#dbe4ee" stroke-width="1.5"/><rect x="32" y="130" width="836" height="135" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="52" y="165.0" text-anchor="start" style="font-size:22px" fill="#276dc5">中央资源层：知道哪里还有多少资源</text><text x="52" y="217.0" text-anchor="start" style="font-size:17px" fill="#203149">节点 A：CPU / 主存 / GPU</text><text x="322" y="217.0" text-anchor="start" style="font-size:17px" fill="#203149">节点 B：CPU / 主存 / GPU</text><text x="592" y="217.0" text-anchor="start" style="font-size:17px" fill="#203149">申请 → 配额 → 回收</text><line x1="232" y1="275" x2="232" y2="325" stroke="#52677c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="32" y="340" width="400" height="175" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="52" y="377.0" text-anchor="start" style="font-size:22px" fill="#008c7c">应用 A：多轮 Agent</text><text x="52" y="423.0" text-anchor="start" style="font-size:19px" fill="#203149">下一轮依赖哪个工具？</text><text x="52" y="451.5" text-anchor="start" style="font-size:19px" fill="#203149">哪些状态下次还要复用？</text><line x1="668" y1="275" x2="668" y2="325" stroke="#52677c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="468" y="340" width="400" height="175" rx="10" fill="#f1ebfa" stroke="#7950b4" stroke-width="1.5"/><text x="488" y="377.0" text-anchor="start" style="font-size:22px" fill="#7950b4">应用 B：模型训练</text><text x="488" y="423.0" text-anchor="start" style="font-size:19px" fill="#203149">哪些 worker 必须一起工作？</text><text x="488" y="451.5" text-anchor="start" style="font-size:19px" fill="#203149">何时允许安全切换？</text><rect x="32" y="580" width="836" height="60" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="48" y="605.0" text-anchor="start" style="font-size:17px" fill="#008c7c">中央层守住总预算；应用层提供依赖与状态代价。只看显存百分比，无法知道谁更急。</text></g></svg>