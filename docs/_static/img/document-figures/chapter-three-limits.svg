<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1360" viewBox="0 0 900 680"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677c"/></marker></defs><rect width="900" height="680" fill="white"/><g font-family="Droid Sans Fallback"><text x="32" y="38.0" text-anchor="start" style="font-size:26px" fill="#203149">一个“并发数”不够：会话、准备、GPU 要分别看</text><text x="32" y="74.0" text-anchor="start" style="font-size:17px" fill="#52677c">教学设计：节点可保留 16 个会话，同时准备 4 项，最多让 2 条命令使用 GPU。</text><line x1="32" y1="95" x2="868" y2="95" stroke="#dbe4ee" stroke-width="1.5"/><text x="32" y="135.0" text-anchor="start" style="font-size:21px" fill="#276dc5">① 会话驻留：16 个</text><rect x="35" y="160" width="42" height="48" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="56" y="191.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">1</text><rect x="86" y="160" width="42" height="48" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="107" y="191.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">2</text><rect x="137" y="160" width="42" height="48" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="158" y="191.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">3</text><rect x="188" y="160" width="42" height="48" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="209" y="191.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">4</text><rect x="239" y="160" width="42" height="48" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="260" y="191.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">5</text><rect x="290" y="160" width="42" height="48" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="311" y="191.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">6</text><rect x="341" y="160" width="42" height="48" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="362" y="191.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">7</text><rect x="392" y="160" width="42" height="48" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="413" y="191.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">8</text><rect x="443" y="160" width="42" height="48" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="464" y="191.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">9</text><rect x="494" y="160" width="42" height="48" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="515" y="191.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">10</text><rect x="545" y="160" width="42" height="48" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="566" y="191.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">11</text><rect x="596" y="160" width="42" height="48" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="617" y="191.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">12</text><rect x="647" y="160" width="42" height="48" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="668" y="191.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">13</text><rect x="698" y="160" width="42" height="48" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="719" y="191.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">14</text><rect x="749" y="160" width="42" height="48" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="770" y="191.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">15</text><rect x="800" y="160" width="42" height="48" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="821" y="191.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">16</text><text x="32" y="247.0" text-anchor="start" style="font-size:18px" fill="#203149">文件、容器和主存还在；其中许多会话正在等模型或排队。</text><text x="32" y="304.0" text-anchor="start" style="font-size:21px" fill="#c8790c">② CPU 准备：4 项</text><rect x="35" y="325" width="185" height="58" rx="10" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="127" y="361.0" text-anchor="middle" style="font-size:20px" fill="#c8790c">导入库</text><rect x="246" y="325" width="185" height="58" rx="10" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="338" y="361.0" text-anchor="middle" style="font-size:20px" fill="#c8790c">读权重</text><rect x="457" y="325" width="185" height="58" rx="10" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="549" y="361.0" text-anchor="middle" style="font-size:20px" fill="#c8790c">预处理</text><rect x="668" y="325" width="185" height="58" rx="10" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="760" y="361.0" text-anchor="middle" style="font-size:20px" fill="#c8790c">编译</text><text x="32" y="441.0" text-anchor="start" style="font-size:21px" fill="#008c7c">③ GPU 使用：2 条</text><rect x="35" y="465" width="395" height="60" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="232" y="502.0" text-anchor="middle" style="font-size:20px" fill="#008c7c">GPU 命令 1：预约与执行</text><rect x="455" y="465" width="395" height="60" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="652" y="502.0" text-anchor="middle" style="font-size:20px" fill="#008c7c">GPU 命令 2：预约与执行</text><rect x="32" y="600" width="836" height="60" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="48" y="625.0" text-anchor="start" style="font-size:17px" fill="#008c7c">16、4、2 管不同阶段。独立准备限流是设计示意，当前通用命令未自动拆成三段。</text></g></svg>