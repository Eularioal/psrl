<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1340" viewBox="0 0 900 670"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677c"/></marker></defs><rect width="900" height="670" fill="white"/><g font-family="Droid Sans Fallback"><text x="32" y="38.0" text-anchor="start" style="font-size:26px" fill="#203149">MPS 提供共运行机会，不会把 GPU 计算能力翻倍</text><text x="32" y="74.0" text-anchor="start" style="font-size:17px" fill="#52677c">教学资源格：每格代表一份可用计算机会。实际 SM 分配并非下图这种固定切块。</text><line x1="32" y1="95" x2="868" y2="95" stroke="#dbe4ee" stroke-width="1.5"/><text x="32" y="150.0" text-anchor="start" style="font-size:22px" fill="#008c7c">A 没用满：B 可能填空</text><rect x="40" y="177" width="42" height="54" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="61" y="212.0" text-anchor="middle" style="font-size:19px" fill="#276dc5">A</text><rect x="91" y="177" width="42" height="54" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="112" y="212.0" text-anchor="middle" style="font-size:19px" fill="#276dc5">A</text><rect x="142" y="177" width="42" height="54" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="163" y="212.0" text-anchor="middle" style="font-size:19px" fill="#276dc5">A</text><rect x="193" y="177" width="42" height="54" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="214" y="212.0" text-anchor="middle" style="font-size:19px" fill="#276dc5">A</text><rect x="244" y="177" width="42" height="54" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="265" y="212.0" text-anchor="middle" style="font-size:19px" fill="#276dc5">A</text><rect x="295" y="177" width="42" height="54" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="316" y="212.0" text-anchor="middle" style="font-size:19px" fill="#276dc5">A</text><rect x="346" y="177" width="42" height="54" rx="3" fill="#e