<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1360" viewBox="0 0 900 680"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677c"/></marker></defs><rect width="900" height="680" fill="white"/><g font-family="Droid Sans Fallback"><text x="32" y="38.0" text-anchor="start" style="font-size:26px" fill="#203149">工具里训出模型，不等于它已成为下一代 Agent</text><text x="32" y="74.0" text-anchor="start" style="font-size:17px" fill="#52677c">机制示意：任务模型产物与当前策略模型属于不同用途。模型接管是单独的提案。</text><line x1="32" y1="95" x2="868" y2="95" stroke="#dbe4ee" stroke-width="1.5"/><rect x="32" y="145" width="350" height="145" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="52" y="181.0" text-anchor="start" style="font-size:22px" fill="#276dc5">当前 Agent：策略版本 v10</text><text x="52" y="225.0" text-anchor="start" style="font-size:19px" fill="#203149">仍负责生成动作与推进任务</text><text x="52" y="264.0" text-anchor="start" style="font-size:17px" fill="#203149">原生训练更新走既有同步路径</text><rect x="518" y="145" width="350" height="145" rx="10" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="538" y="181.0" text-anchor="start" style="font-size:22px" fill="#c8790c">工具训练出的候选模型</text><text x="538" y="225.0" text-anchor="start" style="font-size:19px" fill="#203149">先作为文件 / 权重产物保存</text><text x="538" y="264.0" text-anchor="start" style="font-size:17px" fill="#203149">还没获得 Agent 服务身份</text><line x1="695" y1="295" x2="695" y2="330" stroke="#52677c" stroke-width="1.5"/><line x1="695" y1="330" x2="165" y2="330" stroke="#52677c" stroke-width="1.5"/><line x1="165" y1="330" x2="165" y2="365" stroke="#52677c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="32" y="375" width="266" height="95" rx="10" fill="#f1ebfa" stroke="#7950b4" stroke-width="1.5"/><text x="165" y="431.0" text-anchor="middle" style="font-size:20px" fill="#7950b4">验证格式与能力</text><line x1="298" y1="422" x2="314" y2="422" stroke="#52677c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="316" y="375" width="266" height="95" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="449" y="431.0" text-anchor="middle" style="font-size:20px" fill="#008c7c">独立评估是否通过</text><line x1="582" y1="422" x2="598" y2="422" stroke="#52677c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="600" y="375" width="266" height="95" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="733" y="431.0" text-anchor="middle" style="font-size:20px" fill="#276dc5">原子切换 + 可回退</text><text x="32" y="533.0" text-anchor="start" style="font-size:18px" fill="#203149">切换后：新请求用新模型；在途旧请求、KV 缓存和结果版本仍需分开处理。</text><rect x="32" y="600" width="836" height="60" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="48" y="625.0" text-anchor="start" style="font-size:17px" fill="#008c7c">接管闭环尚未接入生产。判断自改进，必须核对产物、评估与服务切换三步。</text></g></svg>