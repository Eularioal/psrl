<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1360" viewBox="0 0 900 680"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677c"/></marker></defs><rect width="900" height="680" fill="white"/><g font-family="Droid Sans Fallback"><text x="32" y="38.0" text-anchor="start" style="font-size:26px" fill="#203149">预测不该只报一个秒数，还要告诉调度器可能差多少</text><text x="32" y="74.0" text-anchor="start" style="font-size:17px" fill="#52677c">教学假设：A 预计空档 20 秒；归还需 2 秒，恢复需 3 秒；B 运行时间随输入变化。</text><line x1="32" y1="95" x2="868" y2="95" stroke="#dbe4ee" stroke-width="1.5"/><text x="32" y="120.0" text-anchor="start" style="font-size:16px" fill="#52677c">同一时间轴（秒）</text><text x="155.0" y="148.0" text-anchor="middle" style="font-size:16px" fill="#52677c">0</text><line x1="155.0" y1="158" x2="155.0" y2="393" stroke="#e2e8f0" stroke-width="1.5"/><text x="383.3333333333333" y="148.0" text-anchor="middle" style="font-size:16px" fill="#52677c">10</text><line x1="383.3333333333333" y1="158" x2="383.3333333333333" y2="393" stroke="#e2e8f0" stroke-width="1.5"/><text x="611.6666666666666" y="148.0" text-anchor="middle" style="font-size:16px" fill="#52677c">20</text><line x1="611.6666666666666" y1="158" x2="611.6666666666666" y2="393" stroke="#e2e8f0" stroke-width="1.5"/><text x="840.0" y="148.0" text-anchor="middle" style="font-size:16px" fill="#52677c">30</text><line x1="840.0" y1="158" x2="840.0" y2="393" stroke="#e2e8f0" stroke-width="1.5"/><text x="32" y="200.0" text-anchor="start" style="font-size:18px" fill="#203149">A 可用空档</text><line x1="155" y1="213" x2="840" y2="213" stroke="#e2e8f0" stroke-width="1.5"/><rect x="155.0" y="175" width="456.66666666666663" height="38" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="383.3333333333333" y="200.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">预计 20 秒</text><text x="32" y="270.0" text-anchor="start" style="font-size:18px" fill="#203149">乐观估计</text><line x1="155" y1="283" x2="840" y2="283" stroke="#e2e8f0" stroke-width="1.5"/><rect x="155.0" y="245" width="45.666666666666664" height="38" rx="3" fill="#f1ebfa" stroke="#7950b4" stroke-width="1.5"/><rect x="200.66666666666666" y="245" width="274.0" height="38" rx="3" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="337.66666666666663" y="270.0" text-anchor="middle" style="font-size:17px" fill="#008c7c">B：12 秒</text><rect x="474.66666666666663" y="245" width="68.5" height="38" rx="3" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="32" y="340.0" text-anchor="start" style="font-size:18px" fill="#203149">保守估计</text><line x1="155" y1="353" x2="840" y2="353" stroke="#e2e8f0" stroke-width="1.5"/><rect x="155.0" y="315" width="45.666666666666664" height="38" rx="3" fill="#f1ebfa" stroke="#7950b4" stroke-width="1.5"/><rect x="200.66666666666666" y="315" width="502.3333333333333" height="38" rx="3" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="451.8333333333333" y="340.0" text-anchor="middle" style="font-size:17px" fill="#008c7c">B：22 秒</text><rect x="703.0" y="315" width="68.5" height="38" rx="3" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="32" y="480.0" text-anchor="start" style="font-size:20px" fill="#008c7c">点预测：2 + 12 + 3 = 17 秒，判断可放入空档。</text><text x="32" y="524.0" text-anchor="start" style="font-size:20px" fill="#c8790c">保守上界：2 + 22 + 3 = 27 秒，A 可能多等 7 秒。</text><rect x="32" y="600" width="836" height="60" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="48" y="625.0" text-anchor="start" style="font-size:17px" fill="#008c7c">根据相似任务校准预测区间；遇到陌生输入或误差增大，退回保守策略。</text></g></svg>