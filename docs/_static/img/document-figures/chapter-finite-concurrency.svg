<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1420" viewBox="0 0 900 710"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677c"/></marker></defs><rect width="900" height="710" fill="white"/><g font-family="Droid Sans Fallback"><text x="32" y="38.0" text-anchor="start" style="font-size:26px" fill="#203149">并发更大、单条更慢：整批究竟快不快？</text><text x="32" y="74.0" text-anchor="start" style="font-size:17px" fill="#52677c">教学数据：固定 30 条同类命令，所有工作都必须完成；每波同时开始、同时结束。</text><line x1="32" y1="95" x2="868" y2="95" stroke="#dbe4ee" stroke-width="1.5"/><text x="32" y="134.0" text-anchor="start" style="font-size:18px" fill="#203149">并发数</text><text x="145" y="134.0" text-anchor="start" style="font-size:18px" fill="#203149">每波耗时</text><text x="300" y="134.0" text-anchor="start" style="font-size:18px" fill="#203149">同样 30 条的总时间 = 波数 × 每波时间</text><text x="65" y="190.0" text-anchor="middle" style="font-size:21px" fill="#276dc5">1</text><text x="180" y="190.0" text-anchor="middle" style="font-size:19px" fill="#276dc5">10 秒</text><rect x="300" y="165" width="470.0" height="38" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="782.0" y="191.0" text-anchor="start" style="font-size:19px" fill="#276dc5">300 秒</text><text x="65" y="262.0" text-anchor="middle" style="font-size:21px" fill="#276dc5">2</text><text x="180" y="262.0" text-anchor="middle" style="font-size:19px" fill="#276dc5">14 秒</text><rect x="300" y="237" width="329.0" height="38" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="641.0" y="263.0" text-anchor="start" style="font-size:19px" fill="#276dc5">210 秒</text><text x="65" y="334.0" text-anchor="middle" style="font-size:21px" fill="#008c7c">5</text><text x="180" y="334.0" text-anchor="middle" style="font-size:19px" fill="#008c7c">25 秒</text><rect x="300" y="309" width="235.0" height="38" rx="3" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="547.0" y="335.0" text-anchor="start" style="font-size:19px" fill="#008c7c">150 秒</text><text x="65" y="406.0" text-anchor="middle" style="font-size:21px" fill="#276dc5">10</text><text x="180" y="406.0" text-anchor="middle" style="font-size:19px" fill="#276dc5">80 秒</text><rect x="300" y="381" width="376.0" height="38" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="688.0" y="407.0" text-anchor="start" style="font-size:19px" fill="#276dc5">240 秒</text><text x="65" y="478.0" text-anchor="middle" style="font-size:21px" fill="#276dc5">30</text><text x="180" y="478.0" text-anchor="middle" style="font-size:19px" fill="#276dc5">300 秒</text><rect x="300" y="453" width="470.0" height="38" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="782.0" y="479.0" text-anchor="start" style="font-size:19px" fill="#276dc5">300 秒</text><text x="32" y="574.0" text-anchor="start" style="font-size:20px" fill="#008c7c">1 → 5 并发：单条 10 → 25 秒，但整批 300 → 150 秒。</text><rect x="32" y="630" width="836" height="60" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="48" y="655.0" text-anchor="start" style="font-size:17px" fill="#008c7c">先找固定工作量的最短完成时间。显存装得下 30 条，只给出容量范围。</text></g></svg>