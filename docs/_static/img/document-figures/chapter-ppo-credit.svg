<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 900 650"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677c"/></marker></defs><rect width="900" height="650" fill="white"/><g font-family="Droid Sans Fallback"><text x="32" y="38.0" text-anchor="start" style="font-size:26px" fill="#203149">整条回答只有最终得分，前面的 token 怎样得到训练信号？</text><text x="32" y="74.0" text-anchor="start" style="font-size:17px" fill="#52677c">教学关系图：奖励先转成优势 A，再给生成 token 的概率更新方向；图中不比较算法效果。</text><line x1="32" y1="95" x2="868" y2="95" stroke="#dbe4ee" stroke-width="1.5"/><text x="32" y="140.0" text-anchor="start" style="font-size:21px" fill="#203149">模型生成的动作 / token</text><rect x="48" y="164" width="92" height="60" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="94" y="201.0" text-anchor="middle" style="font-size:22px" fill="#276dc5">t1</text><rect x="161" y="164" width="92" height="60" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="207" y="201.0" text-anchor="middle" style="font-size:22px" fill="#276dc5">t2</text><rect x="274" y="164" width="92" height="60" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="320" y="201.0" text-anchor="middle" style="font-size:22px" fill="#276dc5">t3</text><rect x="387" y="164" width="92" height="60" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="433" y="201.0" text-anchor="middle" style="font-size:22px" fill="#276dc5">t4</text><rect x="500" y="164" width="92" height="60" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="546" y="201.0" text-anchor="middle" style="font-size:22px" fill="#276dc5">t5</text><rect x="613" y="164" width="92" height="60" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="659" y="201.0" text-anchor="middle" style="font-size:22px" fill="#276dc5">t6</text><rect x="726" y="164" width="92" height="60" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="772" y="201.0" text-anchor="middle" style="font-size:22px" fill="#008c7c">t7</text><rect x="599" y="274" width="220" height="76" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="709" y="305.0" text-anchor="middle" style="font-size:21px" fill="#008c7c">最终判题奖励</text><text x="709" y="335.0" text-anchor="middle" style="font-size:17px" fill="#008c7c">例如成功 / 失败</text><line x1="709" y1="350" x2="709" y2="397" stroke="#52677c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="48" y="407" width="771" height="98" rx="10" fill="#f1ebfa" stroke="#7950b4" stroke-width="1.5"/><text x="68" y="444.0" text-anchor="start" style="font-size:21px" fill="#7950b4">PPO：结合价值估计，把后续收益传回较早动作。</text><text x="68" y="482.0" text-anchor="start" style="font-size:20px" fill="#7950b4">GRPO：比较同题多条回答的奖励，形成组内相对方向。</text><rect x="32" y="570" width="836" height="60" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="48" y="595.0" text-anchor="start" style="font-size:17px" fill="#008c7c">优势决定鼓励还是抑制；概率比和裁剪再约束这次更新幅度。它们回答不同问题。</text></g></svg>