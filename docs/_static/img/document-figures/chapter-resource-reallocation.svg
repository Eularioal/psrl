<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 900 650"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677c"/></marker></defs><rect width="900" height="650" fill="white"/><g font-family="Droid Sans Fallback"><text x="32" y="38.0" text-anchor="start" style="font-size:26px" fill="#203149">八张卡怎样分：资源应该帮助较慢的那一段</text><text x="32" y="74.0" text-anchor="start" style="font-size:17px" fill="#52677c">教学模型：每份工作都先过阶段 A，再过阶段 B；持续供给时由较慢阶段限制速率。</text><line x1="32" y1="95" x2="868" y2="95" stroke="#dbe4ee" stroke-width="1.5"/><text x="32" y="186.0" text-anchor="start" style="font-size:20px" fill="#203149">A/B = 4/4</text><rect x="195" y="155" width="42" height="46" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="216" y="185.0" text-anchor="middle" style="font-size:20px" fill="#276dc5">A</text><rect x="247" y="155" width="42" height="46" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="268" y="185.0" text-anchor="middle" style="font-size:20px" fill="#276dc5">A</text><rect x="299" y="155" width="42" height="46" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="320" y="185.0" text-anchor="middle" style="font-size:20px" fill="#276dc5">A</text><rect x="351" y="155" width="42" height="46" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="372" y="185.0" text-anchor="middle" style="font-size:20px" fill="#276dc5">A</text><rect x="403" y="155" width="42" height="46" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="424" y="185.0" text-anchor="middle" style="font-size:20px" fill="#008c7c">B</text><rect x="455" y="155" width="42" height="46" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="476" y="185.0" text-anchor="middle" style="font-size:20px" fill="#008c7c">B</text><rect x="507" y="155" width="42" height="46" rx="10" fill="#