<svg xmlns="http://www.w3.org/2000/svg" width="800" height="578" viewBox="0 0 900 650"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677c"/></marker></defs><rect width="900" height="650" fill="white"/><g font-family="Droid Sans Fallback"><text x="32" y="38.0" text-anchor="start" style="font-size:26px" fill="#203149">普通生成可以共运行，模型控制操作要等环境归还</text><text x="32" y="74.0" text-anchor="start" style="font-size:17px" fill="#52677c">机制示意：共享票据记录在途环境命令。横向表示先后，不按真实秒数绘制。</text><line x1="32" y1="95" x2="868" y2="95" stroke="#dbe4ee" stroke-width="1.5"/><rect x="155" y="160" width="135" height="60" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="222" y="197.0" text-anchor="middle" style="font-size:19px" fill="#276dc5">拿票据</text><rect x="310" y="160" width="135" height="60" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="377" y="197.0" text-anchor="middle" style="font-size:19px" fill="#008c7c">环境执行</text><rect x="505" y="160" width="135" height="60" rx="10" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="572" y="197.0" text-anchor="middle" style="font-size:19px" fill="#c8790c">物理归还</text><rect x="700" y="160" width="135" height="60" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="767" y="197.0" text-anchor="middle" style="font-size:19px" fill="#276dc5">放票据</text><text x="32" y="198.0" text-anchor="start" style="font-size:19px" fill="#203149">环境命令</text><line x1="290" y1="190" x2="310" y2="190" stroke="#52677c" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="445" y1="190" x2="505" y2="190" stroke="#52677c" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="640" y1="190" x2="700" y2="190" stroke="#52677c" stroke-width="1.5" marker-end="url(#arrow)"/><text x="32" y="300.0" text-anchor="start" style="font-size:19px" fill="#203149">普通生成</text><rect x="155" y="260" width="680" height="56" rx="10" fill="#f1ebfa" stroke="#7950b4" stroke-width="1.5"/><text x="495" y="295.0" text-anchor="middle" style="font-size:18px" fill="#7950b4">模型醒着时，可与环境直接共运行；速度是否划算另测。</text><text x="32" y="410.0" text-anchor="start" style="font-size:19px" fill="#203149">唤醒 / 更新</text><rect x="310" y="366" width="390" height="60" rx="10" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="505" y="402.0" text-anchor="middle" style="font-size:18px" fill="#c8790c">已排队：等待所有共享票据归还</text><line x1="768" y1="220" x2="768" y2="445" stroke="#276dc5" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="700" y="366" width="135" height="60" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="767" y="402.0" text-anchor="middle" style="font-size:18px" fill="#276dc5">再执行控制</text><text x="155" y="500.0" text-anchor="start" style="font-size:18px" fill="#203149">控制操作排队后，停止准入新的环境命令，避免控制一直等下去。</text><rect x="32" y="570" width="836" height="60" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="48" y="595.0" text-anchor="start" style="font-size:17px" fill="#008c7c">输出可读、命令返回、显存物理释放是不同事件。放票据前必须完成归还确认。</text></g></svg>