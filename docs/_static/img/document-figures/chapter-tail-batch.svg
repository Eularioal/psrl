<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 900 640"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677c"/></marker></defs><rect width="900" height="640" fill="white"/><g font-family="Droid Sans Fallback"><text x="32" y="38.0" text-anchor="start" style="font-size:26px" fill="#203149">只有 12 条待办，10 并发的吞吐最好也未必该选</text><text x="32" y="74.0" text-anchor="start" style="font-size:17px" fill="#52677c">教学假设：10 条一波用 100 秒，2 条一波用 30 秒；比较相同 12 条工作。</text><line x1="32" y1="95" x2="868" y2="95" stroke="#dbe4ee" stroke-width="1.5"/><text x="32" y="115.0" text-anchor="start" style="font-size:16px" fill="#52677c">同一时间轴（秒）</text><text x="155.0" y="143.0" text-anchor="middle" style="font-size:16px" fill="#52677c">0</text><line x1="155.0" y1="153" x2="155.0" y2="388" stroke="#e2e8f0" stroke-width="1.5"/><text x="383.3333333333333" y="143.0" text-anchor="middle" style="font-size:16px" fill="#52677c">50</text><line x1="383.3333333333333" y1="153" x2="383.3333333333333" y2="388" stroke="#e2e8f0" stroke-width="1.5"/><text x="611.6666666666666" y="143.0" text-anchor="middle" style="font-size:16px" fill="#52677c">100</text><line x1="611.6666666666666" y1="153" x2="611.6666666666666" y2="388" stroke="#e2e8f0" stroke-width="1.5"/><text x="748.6666666666666" y="143.0" text-anchor="middle" style="font-size:16px" fill="#52677c">130</text><line x1="748.6666666666666" y1="153" x2="748.6666666666666" y2="388" stroke="#e2e8f0" stroke-width="1.5"/><text x="840.0" y="143.0" text-anchor="middle" style="font-size:16px" fill="#52677c">150</text><line x1="840.0" y1="153" x2="840.0" y2="388" stroke="#e2e8f0" stroke-width="1.5"/><text x="32" y="195.0" text-anchor="start" style="font-size:18px" fill="#203149">先 10 后 2</text><line x1="155" y1="208" x2="840" y2="208" stroke="#e2e8f0" stroke-width="1.5"/><rect x="155.0" y="170" width="456.66666666666663" height="38" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="383.3333333333333" y="195.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">10 条：100 秒</text><rect x="611.6666666666666" y="170" width="137.0" height="38" rx="3" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="680.1666666666666" y="195.0" text-anchor="middle" style="font-size:17px" fill="#008c7c">2 条：30 秒</text><text x="32" y="265.0" text-anchor="start" style="font-size:18px" fill="#203149">12 条一起①</text><line x1="155" y1="278" x2="840" y2="278" stroke="#e2e8f0" stroke-width="1.5"/><rect x="155.0" y="240" width="570.8333333333333" height="38" rx="3" fill="#f1ebfa" stroke="#7950b4" stroke-width="1.5"/><text x="440.41666666666663" y="265.0" text-anchor="middle" style="font-size:17px" fill="#7950b4">125 秒：比先 10 后 2 早 5 秒</text><text x="32" y="335.0" text-anchor="start" style="font-size:18px" fill="#203149">12 条一起②</text><line x1="155" y1="348" x2="840" y2="348" stroke="#e2e8f0" stroke-width="1.5"/><rect x="155.0" y="310" width="685.0" height="38" rx="3" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="497.5" y="335.0" text-anchor="middle" style="font-size:17px" fill="#c8790c">150 秒：比先 10 后 2 晚 20 秒</text><text x="32" y="470.0" text-anchor="start" style="font-size:20px" fill="#7950b4">① 持续吞吐略低，但消除了小尾批，当前这批仍更快。</text><text x="32" y="512.0" text-anchor="start" style="font-size:20px" fill="#c8790c">② 额外竞争太重，超过省掉尾批的收益，分两波更快。</text><rect x="32" y="560" width="836" height="60" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="48" y="585.0" text-anchor="start" style="font-size:17px" fill="#008c7c">持续满负载看完成率；有限待办看最后完成时刻。两种问题不能共用一个阈值。</text></g></svg>