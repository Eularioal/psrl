<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1340" viewBox="0 0 900 670"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677c"/></marker></defs><rect width="900" height="670" fill="white"/><g font-family="Droid Sans Fallback"><text x="32" y="38.0" text-anchor="start" style="font-size:26px" fill="#203149">一个模型实例接很多请求，不等于很多模型实例</text><text x="32" y="74.0" text-anchor="start" style="font-size:17px" fill="#52677c">教学布局：每实例权重 6 GiB、KV 池 16 GiB、工作区 4 GiB；不据此推断吞吐。</text><line x1="32" y1="95" x2="868" y2="95" stroke="#dbe4ee" stroke-width="1.5"/><rect x="32" y="130" width="400" height="345" rx="10" fill="white" stroke="#276dc5" stroke-width="1.5"/><text x="232" y="164.0" text-anchor="middle" style="font-size:22px" fill="#276dc5">一个实例，多个请求</text><rect x="52" y="190" width="360" height="105" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="68" y="220.0" text-anchor="start" style="font-size:19px" fill="#276dc5">实例 1：一套模型与缓存池</text><rect x="68" y="238" width="75.6923076923077" height="40" rx="0" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="105.84615384615384" y="264.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">权重</text><rect x="143.69230769230768" y="238" width="201.84615384615384" height="40" rx="0" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="244.61538461538458" y="264.0" text-anchor="middle" style="font-size:17px" fill="#008c7c">KV</text><rect x="345.53846153846155" y="238" width="50.46153846153846" height="40" rx="0" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="370.7692307692308" y="264.0" text-anchor="middle" style="font-size:17px" fill="#c8790c">临时</text><circle cx="92" cy="359" r="18" fill="#008c7c"/><circle cx="157" cy="359" r="18" fill="#008c7c"/><circle cx="222" cy="359" r="18" fill="#008c7c"/><circle cx="287" cy="359" r="18" fill="#008c7c"/><circle cx="352" cy="359" r="18" fill="#008c7c"/><text x="232" y="422.0" text-anchor="middle" style="font-size:20px" fill="#008c7c">请求在同一引擎内合批</text><rect x="468" y="130" width="400" height="345" rx="10" fill="white" stroke="#7950b4" stroke-width="1.5"/><text x="668" y="164.0" text-anchor="middle" style="font-size:22px" fill="#7950b4">两个实例，各有请求</text><rect x="488" y="190" width="360" height="105" rx="10" fill="#f1ebfa" stroke="#7950b4" stroke-width="1.5"/><text x="504" y="220.0" text-anchor="start" style="font-size:19px" fill="#7950b4">实例 1：一套模型与缓存池</text><rect x="504" y="238" width="75.6923076923077" height="40" rx="0" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="541.8461538461538" y="264.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">权重</text><rect x="579.6923076923077" y="238" width="201.84615384615384" height="40" rx="0" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="680.6153846153846" y="264.0" text-anchor="middle" style="font-size:17px" fill="#008c7c">KV</text><rect x="781.5384615384615" y="238" width="50.46153846153846" height="40" rx="0" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="806.7692307692308" y="264.0" text-anchor="middle" style="font-size:17px" fill="#c8790c">临时</text><rect x="488" y="320" width="360" height="105" rx="10" fill="#f1ebfa" stroke="#7950b4" stroke-width="1.5"/><text x="504" y="350.0" text-anchor="start" style="font-size:19px" fill="#7950b4">实例 2：一套模型与缓存池</text><rect x="504" y="368" width="75.6923076923077" height="40" rx="0" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="541.8461538461538" y="394.0" text-anchor="middle" style="font-size:17px" fill="#276dc5">权重</text><rect x="579.6923076923077" y="368" width="201.84615384615384" height="40" rx="0" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="680.6153846153846" y="394.0" text-anchor="middle" style="font-size:17px" fill="#008c7c">KV</text><rect x="781.5384615384615" y="368" width="50.46153846153846" height="40" rx="0" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="806.7692307692308" y="394.0" text-anchor="middle" style="font-size:17px" fill="#c8790c">临时</text><text x="32" y="526.0" text-anchor="start" style="font-size:20px" fill="#203149">一个实例：26 GiB；两个实例：约 52 GiB，同卡仍要竞争计算。</text><rect x="32" y="590" width="836" height="60" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="48" y="615.0" text-anchor="start" style="font-size:17px" fill="#008c7c">请求数影响一个引擎的批；实例数通常复制权重和 KV 池，实例之间不会自动合批。</text></g></svg>