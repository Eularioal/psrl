<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1380" viewBox="0 0 900 690"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677c"/></marker></defs><rect width="900" height="690" fill="white"/><g font-family="Droid Sans Fallback"><text x="32" y="38.0" text-anchor="start" style="font-size:26px" fill="#203149">CPU 先准备好，再占 GPU，能省掉哪段卡上空等？</text><text x="32" y="74.0" text-anchor="start" style="font-size:17px" fill="#52677c">教学假设：4 项任务，各准备 6 秒、GPU 计算 2 秒；CPU 足够并行，环境只有 2 张卡。</text><line x1="32" y1="95" x2="868" y2="95" stroke="#dbe4ee" stroke-width="1.5"/><text x="32" y="115.0" text-anchor="start" style="font-size:16px" fill="#52677c">同一时间轴（秒）</text><text x="155.0" y="143.0" text-anchor="middle" style="font-size:16px" fill="#52677c">0</text><line x1="155.0" y1="153" x2="155.0" y2="438" stroke="#e2e8f0" stroke-width="1.5"/><text x="411.875" y="143.0" text-anchor="middle" style="font-size:16px" fill="#52677c">6</text><line x1="411.875" y1="153" x2="411.875" y2="438" stroke="#e2e8f0" stroke-width="1.5"/><text x="497.5" y="143.0" text-anchor="middle" style="font-size:16px" fill="#52677c">8</text><line x1="497.5" y1="153" x2="497.5" y2="438" stroke="#e2e8f0" stroke-width="1.5"/><text x="583.125" y="143.0" text-anchor="middle" style="font-size:16px" fill="#52677c">10</text><line x1="583.125" y1="153" x2="583.125" y2="438" stroke="#e2e8f0" stroke-width="1.5"/><text x="840.0" y="143.0" text-anchor="middle" style="font-size:16px" fill="#52677c">16</text><line x1="840.0" y1="153" x2="840.0" y2="438" stroke="#e2e8f0" stroke-width="1.5"/><text x="32" y="195.0" text-anchor="start" style="font-size:18px" fill="#203149">先拿卡：卡0</text><line x1="155" y1="208" x2="840" y2="208" stroke="#e2e8f0" stroke-width="1.5"/><rect x="155.0" y="170" width="256.875" height="38" rx="3" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="283.4375" y="195.0" text-anchor="middle" style="font-size:17px" fill="#c8790c">准备1</text><rect x="411.875" y="170" width="85.625" height="38" rx="3" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="454.6875" y="195.0" text-anchor="middle" style="font-size:17px" fill="#008c7c">算1</text><rect x="497.5" y="170" width="256.875" height="38" rx="3" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="625.9375" y="195.0" text-anchor="middle" style="font-size:17px" fill="#c8790c">准备3</text><rect x="754.375" y="170" width="85.625" height="38" rx="3" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="797.1875" y="195.0" text-anchor="middle" style="font-size:17px" fill="#008c7c">算3</text><text x="32" y="260.0" text-anchor="start" style="font-size:18px" fill="#203149">先拿卡：卡1</text><line x1="155" y1="273" x2="840" y2="273" stroke="#e2e8f0" stroke-width="1.5"/><rect x="155.0" y="235" width="256.875" height="38" rx="3" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="283.4375" y="260.0" text-anchor="middle" style="font-size:17px" fill="#c8790c">准备2</text><rect x="411.875" y="235" width="85.625" height="38" rx="3" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="454.6875" y="260.0" text-anchor="middle" style="font-size:17px" fill="#008c7c">算2</text><rect x="497.5" y="235" width="256.875" height="38" rx="3" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="625.9375" y="260.0" text-anchor="middle" style="font-size:17px" fill="#c8790c">准备4</text><rect x="754.375" y="235" width="85.625" height="38" rx="3" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="797.1875" y="260.0" text-anchor="middle" style="font-size:17px" fill="#008c7c">算4</text><text x="32" y="325.0" text-anchor="start" style="font-size:18px" fill="#203149">先准备：CPU</text><line x1="155" y1="338" x2="840" y2="338" stroke="#e2e8f0" stroke-width="1.5"/><rect x="155.0" y="300" width="256.875" height="38" rx="3" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="283.4375" y="325.0" text-anchor="middle" style="font-size:17px" fill="#c8790c">四项同时准备</text><text x="32" y="390.0" text-anchor="start" style="font-size:18px" fill="#203149">先准备：两卡</text><line x1="155" y1="403" x2="840" y2="403" stroke="#e2e8f0" stroke-width="1.5"/><rect x="411.875" y="365" width="85.625" height="38" rx="3" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="454.6875" y="390.0" text-anchor="middle" style="font-size:17px" fill="#008c7c">1+2</text><rect x="497.5" y="365" width="85.625" height="38" rx="3" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="540.3125" y="390.0" text-anchor="middle" style="font-size:17px" fill="#008c7c">3+4</text><text x="32" y="530.0" text-anchor="start" style="font-size:20px" fill="#008c7c">同样 4 项：16 秒 → 10 秒；提前做准备，没有减少 GPU 工作量。</text><rect x="32" y="610" width="836" height="60" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="48" y="635.0" text-anchor="start" style="font-size:17px" fill="#008c7c">这是已有 prepared 接口能表达的合作式执行。它不会自动拆解任意 shell 命令。</text></g></svg>