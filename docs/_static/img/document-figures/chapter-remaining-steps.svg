<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 900 620"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677c"/></marker></defs><rect width="900" height="620" fill="white"/><g font-family="Droid Sans Fallback"><text x="32" y="38.0" text-anchor="start" style="font-size:26px" fill="#203149">知道还剩多少小步，才比较容易估计结束时间</text><text x="32" y="74.0" text-anchor="start" style="font-size:17px" fill="#52677c">教学假设：程序共 100 步，已完成 80 步；近期每步 0.2 秒，剩余收尾预计 3 秒。</text><line x1="32" y1="95" x2="868" y2="95" stroke="#dbe4ee" stroke-width="1.5"/><text x="32" y="144.0" text-anchor="start" style="font-size:22px" fill="#276dc5">执行进度</text><rect x="38" y="175" width="33" height="65" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><rect x="79" y="175" width="33" height="65" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><rect x="120" y="175" width="33" height="65" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><rect x="161" y="175" width="33" height="65" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><rect x="202" y="175" width="33" height="65" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><rect x="243" y="175" width="33" height="65" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><rect x="284" y="175" width="33" height="65" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><rect x="325" y="175" width="33" height="65" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><rect x="366" y="175" width="33" height="65" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><rect x="407" y="175" width="33" height="65" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><rect x="448" y="175" width="33" height="65" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><rect x="489" y="175" width="33" height="65" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><rect x="530" y="175" width="33" height="65" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><rect x="571" y="175" width="33" height="65" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><rect x="612" y="175" width="33" height="65" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><rect x="653" y="175" width="33" height="65" rx="3" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><rect x="694" y="175" width="33" height="65" rx="3" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><rect x="735" y="175" width="33" height="65" rx="3" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><rect x="776" y="175" width="33" height="65" rx="3" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><rect x="817" y="175" width="33" height="65" rx="3" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="38" y="280.0" text-anchor="start" style="font-size:20px" fill="#276dc5">已完成 80 步</text><text x="672" y="280.0" text-anchor="start" style="font-size:20px" fill="#c8790c">剩余 20 步</text><text x="32" y="355.0" text-anchor="start" style="font-size:24px" fill="#008c7c">从现在到完成：20 × 0.2 + 3 = 7 秒。</text><text x="32" y="410.0" text-anchor="start" style="font-size:19px" fill="#203149">若刚才的报告已经过期，不能每过一秒就机械地减一秒。</text><text x="32" y="455.0" text-anchor="start" style="font-size:19px" fill="#203149">程序可能卡住、下一步变慢，或尚有未报告的保存与显存清理。</text><rect x="32" y="540" width="836" height="60" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="48" y="565.0" text-anchor="start" style="font-size:17px" fill="#008c7c">这是基于进度的估计。必须绑定工作量、运行阶段和并发条件，并用实际完成记录校准。</text></g></svg>