<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1340" viewBox="0 0 900 670"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677c"/></marker></defs><rect width="900" height="670" fill="white"/><g font-family="Droid Sans Fallback"><text x="32" y="38.0" text-anchor="start" style="font-size:26px" fill="#203149">文件已经改了，进程为什么还会跑旧代码？</text><text x="32" y="74.0" text-anchor="start" style="font-size:17px" fill="#52677c">机制示意：Python 已把模块读入进程；之后修改磁盘文件，不会自动替换内存对象。</text><line x1="32" y1="95" x2="868" y2="95" stroke="#dbe4ee" stroke-width="1.5"/><rect x="32" y="133" width="400" height="345" rx="10" fill="white" stroke="#276dc5" stroke-width="1.5"/><text x="232" y="168.0" text-anchor="middle" style="font-size:23px" fill="#276dc5">修改前</text><rect x="60" y="199" width="145" height="115" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="132" y="238.0" text-anchor="middle" style="font-size:20px" fill="#276dc5">磁盘代码</text><text x="132" y="280.0" text-anchor="middle" style="font-size:29px" fill="#276dc5">v1</text><rect x="257" y="199" width="145" height="115" rx="10" fill="#f1ebfa" stroke="#7950b4" stroke-width="1.5"/><text x="329" y="238.0" text-anchor="middle" style="font-size:19px" fill="#7950b4">进程内模块</text><text x="329" y="280.0" text-anchor="middle" style="font-size:29px" fill="#7950b4">v1</text><line x1="209" y1="257" x2="253" y2="257" stroke="#52677c" stroke-width="1.5" marker-end="url(#arrow)"/><text x="232" y="376.0" text-anchor="middle" style="font-size:20px" fill="#276dc5">首次导入</text><text x="232" y="425.0" text-anchor="middle" style="font-size:20px" fill="#276dc5">文件与进程一致</text><rect x="468" y="133" width="400" height="345" rx="10" fill="white" stroke="#c8790c" stroke-width="1.5"/><text x="668" y="168.0" text-anchor="middle" style="font-size:23px" fill="#c8790c">只改文件后</text><rect x="496" y="199" width="145" height="115" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="568" y="238.0" text-anchor="middle" style="font-size:20px" fill="#276dc5">磁盘代码</text><text x="568" y="280.0" text-anchor="middle" style="font-size:29px" fill="#276dc5">v2</text><rect x="693" y="199" width="145" height="115" rx="10" fill="#f1ebfa" stroke="#7950b4" stroke-width="1.5"/><text x="765" y="238.0" text-anchor="middle" style="font-size:19px" fill="#7950b4">进程内模块</text><text x="765" y="280.0" text-anchor="middle" style="font-size:29px" fill="#7950b4">v1</text><line x1="645" y1="257" x2="689" y2="257" stroke="#52677c" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="668" y="376.0" text-anchor="middle" style="font-size:20px" fill="#c8790c">没有重新导入 / 重建</text><text x="668" y="425.0" text-anchor="middle" style="font-size:20px" fill="#c8790c">结果可能属于旧版本</text><text x="32" y="532.0" text-anchor="start" style="font-size:20px" fill="#203149">复用前检查状态依赖；代码或数据变了，就更新相应状态，再执行。</text><rect x="32" y="590" width="836" height="60" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="48" y="615.0" text-anchor="start" style="font-size:17px" fill="#008c7c">容器常驻只保留文件和进程环境。安全复用需要另管版本与内存状态的对应关系。</text></g></svg>