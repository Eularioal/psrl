<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 900 640"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677c"/></marker></defs><rect width="900" height="640" fill="white"/><g font-family="Droid Sans Fallback"><text x="32" y="38.0" text-anchor="start" style="font-size:26px" fill="#203149">父任务等子任务，为什么可能谁也走不下去？</text><text x="32" y="74.0" text-anchor="start" style="font-size:17px" fill="#52677c">教学假设：只有一份 GPU 容量。父任务保留它，同时等待子任务完成评估。</text><line x1="32" y1="95" x2="868" y2="95" stroke="#dbe4ee" stroke-width="1.5"/><rect x="32" y="145" width="350" height="170" rx="10" fill="#eaf2ff" stroke="#276dc5" stroke-width="1.5"/><text x="52" y="183.0" text-anchor="start" style="font-size:24px" fill="#276dc5">父任务 A</text><text x="52" y="228.0" text-anchor="start" style="font-size:21px" fill="#203149">持有 GPU</text><text x="52" y="273.0" text-anchor="start" style="font-size:21px" fill="#203149">等待子任务结果</text><rect x="518" y="145" width="350" height="170" rx="10" fill="#fff1d9" stroke="#c8790c" stroke-width="1.5"/><text x="538" y="183.0" text-anchor="start" style="font-size:24px" fill="#c8790c">子任务 B</text><text x="538" y="228.0" text-anchor="start" style="font-size:21px" fill="#203149">先拿到 GPU，才能评估</text><text x="538" y="273.0" text-anchor="start" style="font-size:21px" fill="#203149">等待 A 归还容量</text><line x1="385" y1="180" x2="512" y2="180" stroke="#52677c" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="518" y1="290" x2="389" y2="290" stroke="#52677c" stroke-width="1.5" marker-end="url(#arrow)"/><text x="450" y="360.0" text-anchor="middle" style="font-size:23px" fill="#c64760">持有资源的等待形成环</text><rect x="32" y="410" width="836" height="100" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="52" y="445.0" text-anchor="start" style="font-size:21px" fill="#008c7c">可行动作：A 先安全释放 GPU，或为 B 预留独立容量。</text><text x="52" y="483.0" text-anchor="start" style="font-size:18px" fill="#203149">单纯提高队列优先级无效，因为没有可供 B 使用的资源。</text><rect x="32" y="560" width="836" height="60" rx="10" fill="#e4f5f0" stroke="#008c7c" stroke-width="1.5"/><text x="48" y="585.0" text-anchor="start" style="font-size:17px" fill="#008c7c">这是提案中的风险场景，需同时管理父子依赖、资源持有和归还协议。</text></g></svg>