   <g id="text_1">
    <text style="font-size: 17px; font-family: 'Droid Sans Fallback'; text-anchor: start; fill: #17324d" x="18" y="24.48" transform="rotate(-0 18 24.48)">Env 现状：会话留在节点，GPU 按协议申请与归还</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'Droid Sans Fallback'; text-anchor: start; fill: #445b70" x="18" y="46.08" transform="rotate(-0 18 46.08)">本图为显式启用后的单卡 direct 命令池。共享与整卡调整均需另外配置。</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; text-anchor: start" x="18" y="70.56" transform="rotate(-0 18 70.56)">① 同一条 Agent 轨迹，交替请求模型和执行工具</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; text-anchor: start" x="30.96" y="102.24" transform="rotate(-0 30.96 102.24)">模型请求 → SMG → vLLM 副本</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'Droid Sans Fallback'; text-anchor: start" x="30.96" y="128.16" transform="rotate(-0 30.96 128.16)">返回回答，Agent 决定下一条操作</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; text-anchor: start" x="318.24" y="102.24" transform="rotate(-0 318.24 102.24)">GPU 工具 → EnvRouter＋资源账本</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'Droid Sans Fallback'; text-anchor: start" x="318.24" y="128.16" transform="rotate(-0 318.24 128.16)">检查预算、占用、权限与物理归还</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; text-anchor: start" x="30.24" y="177.84" transform="rotate(-0 30.24 177.84)">② 容器在原节点，下一条命令可重新选择同机候选 GPU</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; text-anchor: start" x="41.76" y="212.4" transform="rotate(-0 41.76 212.4)">会话资源持续保留</text>
   </g>
