   <g id="text_1">
    <text style="font-weight: 700; font-size: 17px; font-family: 'Droid Sans Fallback'; text-anchor: start" x="21.6" y="25.2" transform="rotate(-0 21.6 25.2)">统一主基线：固定环境卡池，episode 全程持卡</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'Droid Sans Fallback'; text-anchor: start" x="21.6" y="48.24" transform="rotate(-0 21.6 48.24)">① 卡的角色固定。只有绿色池接纳环境，满了就等。</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Droid Sans Fallback'; text-anchor: start" x="21.6" y="70.56" transform="rotate(-0 21.6 70.56)">两张训练卡</text>
