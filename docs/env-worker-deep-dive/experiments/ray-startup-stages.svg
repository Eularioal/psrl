   <g id="text_1">
    <text style="font-size: 16px; font-family: 'Droid Sans Fallback'; text-anchor: start" x="18" y="23.04" transform="rotate(-0 18 23.04)">Ray 启动排障：进程存在、注册成功、Actor 就绪是三件事</text>
