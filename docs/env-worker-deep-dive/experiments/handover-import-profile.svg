  </g>
  <g id="text_17">
   <text style="font-size: 11px; font-family: 'Droid Sans Fallback'; text-anchor: start" x="34.56" y="56.304" transform="rotate(-0 34.56 56.304)">私有节点实测，每次启动新 Python 进程。只移动 2434 个 Transformers 文件。</text>
  </g>
  <g id="text_18">
   <text style="font-size: 11px; font-family: 'Droid Sans Fallback'; text-anchor: start" x="34.56" y="293.112" transform="rotate(-0 34.56 293.112)">色条是等待到导入完成的时间，黑色菱形是各线程累计的 CPU 时间。</text>
  </g>
  <g id="text_19">
   <text style="font-size: 11px; font-family: 'Droid Sans Fallback'; text-anchor: start" x="34.56" y="312.6528" transform="rotate(-0 34.56 312.6528)">两种位置的 CPU 时间均约 7.5 秒。多线程 CPU 时间可以超过实际经过时间。</text>
  </g>
