# BEGIN Codex terminal scroll fix
# Keep the wheel in tmux history instead of application input history.
set-option -g mouse on
bind-key -n WheelUpPane if-shell -F -t = '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e -t = ; send-keys -X -N 5 -t = scroll-up'
bind-key -n WheelDownPane if-shell -F -t = '#{pane_in_mode}' 'send-keys -M' ''
bind-key -T copy-mode WheelUpPane select-pane \; send-keys -X -N 5 scroll-up
bind-key -T copy-mode WheelDownPane select-pane \; send-keys -X -N 5 scroll-down
bind-key -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 5 scroll-up
bind-key -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 5 scroll-down
# Scrolling over the status bar must not switch windows either.
unbind-key -T root WheelUpStatus
unbind-key -T root WheelDownStatus
# END Codex terminal scroll fix
